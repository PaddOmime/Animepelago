      sfx("bad"); say2(t("bgUsed") + " " + t("bgTurnLost", label), "bad");
    } else if (ok) {
      st.cells[r][c] = ok; st.owner[r][c] = who; st.by[r][c] = player; sfx("ok"); placed = true; if (st.risk) st.placedN[who]++;
      say2(t("bgRight2", label, displayTitleOf(ok, st.lang)) + (fuzzy ? " " + t("typoOk") : ""), "good");
    } else {
      sfx("bad");
      say2((hits.length ? t("bgNoFit", displayTitleOf(hits[0], st.lang)) : t("unknown")) + " " + t("bgTurnLost", label), "bad");
    }
    st.ptr[who]++;  // im Team ist als Naechstes der naechste Spieler dran
    $("bgGuess").value = ""; st.sel = null;
    const line = placed && st.mode === "line" ? winLine(who) : null;
    if (line) { st.line = line; finish(who); }
    else if (st.cells.flat().every(Boolean)) finish(st.mode === "most" ? mostWinner() : -1);
    else { st.turn = (who + 1) % st.S; if (placed) checkStuck(); }
    draw();
  }
  // Time Attack: ins gewaehlte Feld, sonst automatisch in ein freies passendes Feld (das mit den wenigsten Moeglichkeiten)
  function enterTA(){
    const used = new Set(st.cells.flat().filter(Boolean).map(a => a.id));
    const free = [];
    for (let r = 0; r < st.R; r++) for (let c = 0; c < st.C; c++) if (!st.cells[r][c] && (!st.sel || (st.sel[0] === r && st.sel[1] === c))) free.push([r, c]);
    const fitsAny = a => free.some(([r, c]) => st.rows[r].test(a) && st.cols[c].test(a));
    const {hits, fuzzy} = findAnime($("bgGuess").value, DB.anime, fitsAny);
    const ok = hits.find(fitsAny);
    $("bgGuess").value = "";
    if (ok && used.has(ok.id)) { st.wrong++; sfx("bad"); say2(t("bgUsed") + " " + t("bgTAPenalty", TA_PENALTY / 1000), "bad"); }
    else if (ok) {
      const left = ([r, c]) => st.cand[r][c].filter(a => !used.has(a.id)).length;
      const [r, c] = free.filter(([r, c]) => st.rows[r].test(ok) && st.cols[c].test(ok)).sort((x, y) => left(x) - left(y))[0];
      st.cells[r][c] = ok; st.owner[r][c] = 0; sfx("ok"); if (st.risk) st.placedN[0]++;
      say2(`✓ ${displayTitleOf(ok, st.lang)} → ${st.rows[r].label} + ${st.cols[c].label}` + (fuzzy ? " " + t("typoOk") : ""), "good");
    } else {
      st.wrong++; sfx("bad");
      say2((hits.length ? t("bgNoFit", displayTitleOf(hits[0], st.lang)) : t("unknown")) + " " + t("bgTAPenalty", TA_PENALTY / 1000), "bad");
    }
    st.sel = null;
    if (st.cells.flat().every(Boolean)) finishTA(true); else if (ok) checkStuck();
    draw(); $("bgGuess").focus();
  }
  function finishTA(done, stuck){
    st.over = true; st.tEnd = Date.now(); clearInterval(taTimer);
    const ms = taElapsed(), fields = st.owner.flat().filter(x => x === 0).length;
    try { PROF.bingoTA({name: (nameIn(0)?.value || "").trim().slice(0, 24), members: taMembers(), ms, done, wrong: st.wrong, fields, board: boardId(), boardName: boardLabel()}); } catch(e) {}
    if (done) boardDone();
    if (done) { sfx("win"); say2(t("bgTADone", fmtTime(ms), st.wrong), "good"); }
    else { sfx("bad"); say2((stuck ? t("rkStuckEnd") + " " : "") + t("bgTAGaveUp", fields, st.R * st.C), "warn"); }
  }
  const taBest = (name, board) => PROF.taBest(name, board);
  // Gewinnreihe des Spielers suchen (Zeilen, Spalten, Diagonalen)
  function winLine(p){
    const n = st.n, lines = [];
    for (let i = 0; i < n; i++) { lines.push([...Array(n)].map((_, j) => [i, j])); lines.push([...Array(n)].map((_, j) => [j, i])); }
    lines.push([...Array(n)].map((_, j) => [j, j])); lines.push([...Array(n)].map((_, j) => [j, n - 1 - j]));
    return lines.find(l => l.every(([r, c]) => st.owner[r][c] === p)) || null;
  }
  // Ab 5x5: wer die meisten Felder hat, gewinnt (Gleichstand an der Spitze = unentschieden)
  function mostWinner(){
    const n = [...Array(st.S).keys()].map(p => st.owner.flat().filter(x => x === p).length), top = Math.max(...n);
    return n.filter(x => x === top).length === 1 ? n.indexOf(top) : -1;
  }
  function finish(winner, stuck){
    st.over = true;
    // Ergebnis fuer Bestenliste und Profil: nur selbst eingetippte Namen zaehlen
    const owner = st.owner.flat(), by = st.by.flat(), full = owner.every(x => x >= 0);
    const sides = [...Array(st.S).keys()].map(p => {
      const team = isTeam(p), typed = team ? typedMembers(p) : [(nameIn(p)?.value || "").trim().slice(0, 24)].filter(Boolean);
      return {fields: owner.filter(x => x === p).length, team,
              members: typed.map(m => ({name: m, fields: team ? by.filter((x, k) => x === m && owner[k] === p).length : owner.filter(x => x === p).length}))};
    });
    try { PROF.bingo({sides, winner, size: st.R * st.C, team: sides.some(s => s.team), full}); } catch(e) {}
    if (full) boardDone();
    const pre = stuck ? t("rkStuckEnd") + " " : "";
    if (winner >= 0) { wins[winner]++; sfx("win"); say2(pre + t("bgWinner", pname(winner)), "good"); }
    else { sfx("bad"); say2(pre + t("bgDraw"), "warn"); }
  }
  const say2 = (text, cls) => { $("bgMsg").textContent = text; $("bgMsg").className = cls; };
  $("bgGrid").onclick = e => {
    const td = e.target.closest("td"); if (!td || !st) return;
    const r = +td.dataset.r, c = +td.dataset.c;
    if (st.over) {  // nach dem Spiel: zeigen, was gepasst haette
      const list = st.cand[r][c].slice(0, 8).map(a => displayTitleOf(a, st.lang)).join(", ");
      say2(`${st.rows[r].label} + ${st.cols[c].label}: ${list}${st.cand[r][c].length > 8 ? " …" : ""}`, "");
      return;
    }
    if (st.clearing) { if (st.cells[r][c]) clearCell(r, c); return; }
    if (!st.cells[r][c]) { st.sel = [r, c]; draw(); say2((st.mode === "ta" ? "" : turnText() + " · ") + `${st.rows[r].label} + ${st.cols[c].label}`, ""); $("bgGuess").focus(); }
  };
  $("bgEnter").onclick = enter; onEnter(["bgGuess"], enter);
  $("bgClear").onclick = () => { if (!st || !st.risk || st.over) return; st.clearing = !st.clearing; if (st.clearing) say2(t("rkPick"), "warn"); draw(); };
  // Risiko-Bingo aus dem Menue: neues grosses Zufallsboard
  function risk(){
    if (!riskUnlocked()) return;
    const N = num($("rkSize").value, 7, 10, 10), min = num($("rkMin").value, 1, 3, 2);
    const sp = generateRisk(N, min, $("mLang").value);
    if (!sp) { ["offline", "modes", "connect", "more", "bgEditor"].forEach(id => $(id).classList.add("hide")); $("bingo").classList.remove("hide"); st = null;
      $("bgGrid").innerHTML = ""; $("bgBoard").innerHTML = ""; say2(t("rkNoBoard"), "bad"); return; }
    start(sp);
  }
  // Modus oder Anzahl wechseln: Felder neu bauen, Siege neu zaehlen; Wechsel von/zu Time Attack braucht eine neue Runde
  $("bgTeams").onchange = () => { const wasTA = st && st.mode === "ta"; wins.fill(0); buildSides();
    if (st && (wasTA || taMode())) start(st.spec || null); else if (st) { start(st.spec || null); } };
  $("bgCount").onchange = () => { wins.fill(0); saveSides(); buildSides(); if (st) start(st.spec || null); };
  try { const s = JSON.parse(localStorage.getItem(SIDES_KEY) || "{}"); if (s && s.count) $("bgCount").value = String(num(s.count, 2, MAXS, 2)); } catch(e) {}
  buildSides();
  // "Neue Runde": beim Seed-Board dasselbe Board nochmal, sonst ein neues zufaelliges
  $("bgNew").onclick = () => st && st.spec && st.spec.rnd ? risk() : start(st && st.spec ? st.spec : null);
  $("bgEnd").onclick = () => { if (!st || st.over) return; if (st.mode === "ta") finishTA(false); else if (st.mode === "most") finish(mostWinner()); draw(); };
  $("bgBack").onclick = () => { if (st && st.mode === "ta" && !st.over) { st.over = true; clearInterval(taTimer); } $("bingo").classList.add("hide"); setMode("more"); };
  // Code des laufenden Boards kopieren / Board speichern
  const copy = (text, msgEl) => { const ok = () => { msgEl.textContent = t("bgCopied"); msgEl.className = "good"; };
    try { navigator.clipboard.writeText(text).then(ok, () => { msgEl.textContent = text; msgEl.className = ""; }); } catch(e) { msgEl.textContent = text; } };
  $("bgCopy").onclick = () => st && copy(st.code, $("bgMsg"));
  $("bgSave").onclick = () => { if (!st) return; const sp = cleanSpec({...(st.spec || st.genSpec), name: st.spec?.name || ""}); EDIT.saveSpec(sp); say2(t("bgSaved"), "good"); };

  // ---------- Bingo-Editor und Seed-Modus ----------
  const EDIT = (() => {
    let R = 4, C = 4, rows = [], cols = [], lang = "english", pool = 500, only = "", list = [];
    const TYPES = ["g", "d", "s", "src", "dec", "y", "sea", "l", "l2"];
    function refreshThemes(){
      lang = $("mLang").value; pool = Math.max(50, +$("mPool").value || 500); only = $("mOnly").value;
      const p = poolFor({R, C, pool, only});
      list = themes(p, lang).map(th => ({...th, n: p.filter(th.test).length})).filter(th => th.n > 0);
      return p;
    }
    function open(){
      ["offline", "modes", "connect", "more", "bingo"].forEach(id => $(id).classList.add("hide"));
      $("bgEditor").classList.remove("hide");
      refreshThemes(); resize(); draw();
    }
    function resize(){
      [R, C] = (($("beSize").value || "4") + "x").split("x").map(Number).map((v, i, l) => v || l[0] || 4);
      rows = Array.from({length: R}, (_, i) => rows[i] || ""); cols = Array.from({length: C}, (_, i) => cols[i] || "");
    }
    const spec = () => ({v: 1, R, C, rows, cols, lang, pool, only, name: $("beName").value.trim().slice(0, 40)});
    const sel = (kind, i, val) => `<select data-k="${kind}" data-i="${i}"><option value="">–</option>` + TYPES.map(ty => {
      const opts = list.filter(th => th.key.startsWith(ty + ":"));
      return opts.length ? `<optgroup label="${esc(t("th_" + ty))}">` + opts.map(th => `<option value="${esc(th.key)}"${th.key === val ? " selected" : ""}>${esc(th.label)} (${th.n})</option>`).join("") + `</optgroup>` : "";
    }).join("") + `</select>`;
    function draw(){
      const p = poolFor({R, C, pool, only}), by = new Map(list.map(th => [th.key, th]));
      let h = `<tr><th></th>${cols.map((k, i) => `<th>${sel("c", i, k)}</th>`).join("")}</tr>`;
      for (let r = 0; r < R; r++) {
        h += `<tr><th>${sel("r", r, rows[r])}</th>`;
        for (let c = 0; c < C; c++) {
          const a = by.get(rows[r]), b = by.get(cols[c]);
          const n = a && b ? p.filter(x => a.test(x) && b.test(x)).length : null;
          h += `<td class="${n === 0 ? "bad" : n != null && n < Math.max(R, C) ? "warn" : ""}">${n == null ? "" : n === 0 ? "✕ 0" : n}</td>`;
        }
        h += `</tr>`;
      }
      $("beGrid").innerHTML = h;
      $("beGrid").querySelectorAll("select").forEach(s => s.onchange = () => { (s.dataset.k === "r" ? rows : cols)[+s.dataset.i] = s.value; draw(); });
      // Zustand: Doppelte Kategorie? Feld ohne Loesung? Kann man sich festfahren?
      const keys = [...rows, ...cols], filled = keys.every(Boolean), dup = keys.filter(Boolean).length !== new Set(keys.filter(Boolean)).size;
      let state = "", cls = "";
      if (dup) { state = t("beDup"); cls = "bad"; }
      else if (timeClash(rows.filter(Boolean), cols.filter(Boolean))) { state = t("beYearClash"); cls = "bad"; }
      else if (filled) { const b = fromSpec(cleanSpec(spec()));
        if (b.err) { state = t(b.err === "empty" ? "beEmpty" : "bgSeedMissing"); cls = "bad"; }
        else if (!b.safe) { state = t("beRisky"); cls = "warn"; } else { state = t("beOk"); cls = "good"; } }
      else state = t("beStFill");
      $("beState").textContent = state; $("beState").className = cls;
      const ready = filled && !dup && cls !== "bad";
      $("bePlay").disabled = $("beTA").disabled = $("beSaveBtn").disabled = $("beCopy").disabled = !ready;
      drawSaved();
    }
    // Leere Zeilen/Spalten zufaellig fuellen: nur Kategorien, die mit allen schon gesetzten genug Anime haben
    function fill(){
      const p = poolFor({R, C, pool, only}), by = new Map(list.map(th => [th.key, th])), need = Math.max(2, Math.min(R * C, 6));
      const types = chosenTypes().length ? chosenTypes() : TYPES;
      for (let attempt = 0; attempt < 200; attempt++) {
        const r2 = [...rows], c2 = [...cols], used = new Set([...r2, ...c2].filter(Boolean));
        // others = die Gegenseite (fuer eine Zeile die Spalten): Jahr/Jahrzehnt duerfen sich nicht kreuzen
        const fits = (k, others) => !timeClash([k], others.filter(Boolean)) && others.every(o => !o || p.filter(x => by.get(k).test(x) && by.get(o).test(x)).length >= need);
        const cand = list.filter(th => types.includes(th.key.split(":")[0] === "l2" ? "l" : th.key.split(":")[0]) && th.n >= need).map(th => th.key).sort(() => Math.random() - .5);
        let ok = true;
        for (let i = 0; i < R && ok; i++) if (!r2[i]) { const k = cand.find(k => !used.has(k) && fits(k, c2)); if (k) { r2[i] = k; used.add(k); } else ok = false; }
        for (let i = 0; i < C && ok; i++) if (!c2[i]) { const k = cand.find(k => !used.has(k) && fits(k, r2)); if (k) { c2[i] = k; used.add(k); } else ok = false; }
        if (!ok) continue;
        const b = fromSpec(cleanSpec({...spec(), rows: r2, cols: c2}));
        if (!b.err && (b.safe || attempt > 150)) { rows = r2; cols = c2; break; }
      }
      draw();
    }
    function saveSpec(sp){
      if (!sp) return;
      const l = loadBoards().filter(b => specCode(b) !== specCode(sp));
      l.unshift({...sp, name: sp.name || t("bgBoardN", l.length + 1)}); saveBoards(l);
      if (!$("bgEditor").classList.contains("hide")) drawSaved();
    }
    function load(sp){ R = sp.R; C = sp.C; rows = [...sp.rows]; cols = [...sp.cols]; lang = sp.lang; pool = sp.pool; only = sp.only;
      $("beName").value = sp.name || ""; const size = R === C ? String(R) : `${R}x${C}`; if ([...$("beSize").options].some(o => o.value === size)) $("beSize").value = size;
      const p = poolFor({R, C, pool, only}); list = themes(p, lang).map(th => ({...th, n: p.filter(th.test).length})).filter(th => th.n > 0); draw(); }
    function drawSaved(){
      const l = loadBoards();
      $("beSaved").innerHTML = !l.length ? `<p class="mute">${esc(t("beNoSaved"))}</p>` : l.map((b, i) => `<div class="row" style="align-items:center;margin-bottom:4px">
        <span style="flex:1 1 200px"><b>${esc(b.name || "?")}</b> <span class="mute">${b.R}×${b.C}</span></span>
        <button type="button" data-a="play" data-i="${i}" style="flex:0 0 auto">▶</button><button type="button" data-a="ta" data-i="${i}" style="flex:0 0 auto">⏱</button>
        <button type="button" data-a="edit" data-i="${i}" style="flex:0 0 auto">✏️</button><button type="button" data-a="copy" data-i="${i}" style="flex:0 0 auto">📋</button>
        <button type="button" data-a="del" data-i="${i}" style="flex:0 0 auto">🗑</button></div>`).join("");
      $("beSaved").querySelectorAll("button").forEach(x => x.onclick = () => { const b = loadBoards()[+x.dataset.i]; if (!b) return;
        if (x.dataset.a === "play") playSpec(b, false); if (x.dataset.a === "ta") playSpec(b, true);
        if (x.dataset.a === "edit") load(b); if (x.dataset.a === "copy") copy(specCode(b), $("beMsg"));
        if (x.dataset.a === "del") { if (x.dataset.armed) { saveBoards(loadBoards().filter((_, j) => j !== +x.dataset.i)); drawSaved(); } else { x.dataset.armed = "1"; x.textContent = t("beDelSure"); } } });
    }
    function playSpec(sp, ta){ $("bgTeams").value = ta ? "ta" : "0"; start(sp); }
    $("beSize").onchange = () => { resize(); refreshThemes(); draw(); };
    $("beFill").onclick = fill;
    $("beClear").onclick = () => { rows = rows.map(() => ""); cols = cols.map(() => ""); draw(); };
    $("bePlay").onclick = () => playSpec(cleanSpec(spec()), false);
    $("beTA").onclick = () => playSpec(cleanSpec(spec()), true);
    $("beSaveBtn").onclick = () => { saveSpec(cleanSpec(spec())); $("beMsg").textContent = t("bgSaved"); $("beMsg").className = "good"; };
    $("beCopy").onclick = () => copy(specCode(cleanSpec(spec())), $("beMsg"));
    $("beLoad").onclick = () => { const sp = readCode($("beCode").value); if (!sp) { $("beMsg").textContent = t("beBadCode"); $("beMsg").className = "bad"; return; }
      load(sp); $("beMsg").textContent = t("beLoaded"); $("beMsg").className = "good"; };
    $("beBack").onclick = () => { $("bgEditor").classList.add("hide"); setMode("more"); };
    return {open, saveSpec, load, playSpec};
  })();
  return {start, timeAttack: () => { $("bgTeams").value = "ta"; buildSides(); start(null); },
          normal: () => { if (taMode()) { $("bgTeams").value = "0"; buildSides(); } start(null); }, editor: EDIT.open, risk, riskUnlocked};

})();
$("bgStart").onclick = () => BG.normal();
$("taStart").onclick = () => BG.timeAttack();
$("seedStart").onclick = () => BG.editor();
$("riskStart").onclick = () => BG.risk();
$("oContinue").onclick = () => { if (OFFLINE.saved()) OFFLINE.start(); };
$("oCount").max = $("oGoal").max = $("mPool").max = DB.anime.length;
// Titelsprachen: nur die, die in der Datenbank genug Titel haben (25-%-Regel)
const LANG_NAMES = {english:"English", romaji:"Romaji", japanese:"日本語", german:"Deutsch", spanish:"Español",
  french:"Français", italian:"Italiano", portuguese:"Português"};
$("oLang").innerHTML = (DB.meta.title_languages || ["english","romaji","japanese","german","spanish","french"])
  .map(l => `<option value="${l}">${LANG_NAMES[l] || l}</option>`).join("");
$("mLang").innerHTML = $("oLang").innerHTML;
// Zielgruppen gibt es nur mit "Ein Genre reicht"
const syncDemo = () => { const all = $("oRule").value === "all"; $("oDemo").disabled = all; $("oDemo").parentElement.style.opacity = all ? .5 : 1; };
$("oRule").onchange = syncDemo; syncDemo();
// Start-Anime-Feld nur zeigen, wenn ein Genre gewaehlt ist
$("oOnly").onchange = () => $("oOnlyStartBox").classList.toggle("hide", !$("oOnly").value);
// Genre-Auswahl fuer "Nur ein Genre" (mit Anzahl verfuegbarer Anime)
for (const g of GENRES) {
  const n = DB.anime.filter(a => a.genres.includes(g) || a.demographics.includes(g)).length;
  if (n >= 10) { $("oOnly").insertAdjacentHTML("beforeend", `<option value="${esc(g)}">${esc(g)} (${n})</option>`);
                 $("mOnly").insertAdjacentHTML("beforeend", `<option value="${esc(g)}">${esc(g)} (${n})</option>`); }
}

// ---------- Log und Chat ----------
function playerName(slot){ const p = (G.players||[]).find(p => p.slot === slot && p.team === G.team); return p ? p.alias || p.name : (G.slotInfo[slot]?.name || "Player " + slot); }
function gameOf(slot){ return G.slotInfo[slot]?.game; }
function printJSON(msg){
  return (msg.data||[]).map(part => {
    switch (part.type) {
      case "player_id": return playerName(+part.text);
      case "item_id": return G.dp[gameOf(part.player)]?.items[part.text] ?? "Item " + part.text;
      case "location_id": return G.dp[gameOf(part.player)]?.locs[part.text] ?? "Location " + part.text;
      default: return part.text;
    }
  }).join("");
}
function log(text){ const li = document.createElement("li"); li.textContent = text; $("log").prepend(li); while ($("log").children.length > 200) $("log").lastChild.remove(); }
function say(text, cls){ $("msg").textContent = text; $("msg").className = cls||""; }
const sayNow = () => { const s = $("say").value.trim(); if (s) send({cmd:"Say", text:s}); $("say").value = ""; };
$("sayBtn").onclick = sayNow; onEnter(["say"], sayNow);

applyLang();
setMode("home");
if (PROF.msgPending()) PROF.open();  // nach Import: Profil gleich zeigen
</script>
