<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sicherheit: Die Seite darf nur eigene Skripte laden, Bilder nur von AniList und nur mit Archipelago-Servern
     (WebSocket) und der AniList-API sprechen. So kann eingeschleuster Code nichts nachladen oder Daten wegschicken. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://s4.anilist.co https://*.anilist.co https://image.tmdb.org; connect-src 'self' ws: wss: https://graphql.anilist.co wss://irc-ws.chat.twitch.tv; media-src 'self' https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Animepelago</title>
<style>
:root{--on-accent:var(--fav-on,#191B30);--accent-ink:color-mix(in srgb,var(--accent) 42%,#1E1B33);--i1:#2F7DB8;--i2:#6B4FD1;--i3:#9A640C;--i4:#1F7A52;--bg:#F4F2FA;--fg:#1E1B33;--mute:#5E5978;--card:#FFFFFF;--line:#E2DEF0;--ok:#1f8a4c;--bad:#b3261e;--warn:#c2570c;--perk:#d4a017;--p1:#2f6fd6;--p2:#d9480f;--p3:#8e44ad;--p4:#1f8a4c;--p5:#c2185b;--p6:#00838f;--accent:var(--fav,#FF9EC4);--grey:#ECE9F5}
@media (prefers-color-scheme:dark){:root{--accent-ink:var(--accent);--i1:#9FD8FF;--i2:#C9B6FF;--i3:#FFD38A;--i4:#9FF0C8;--bg:#191B30;--fg:#F1EEFA;--mute:#B9B4D6;--card:#2A2D4A;--line:#3A3E63;--ok:#4cc27e;--bad:#ff6b60;--warn:#ff9a4d;--perk:#f0c93a;--p1:#6fa3ff;--p2:#ff8a4d;--p3:#c08bff;--p4:#4cc27e;--p5:#ff6fa8;--p6:#4dd0e1;--accent:var(--fav,#FF9EC4);--grey:#33365A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.hide{display:none!important}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:8px}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input,label select{width:100%}
label>span:first-child{display:block;margin-bottom:2px}
button{cursor:pointer}
button.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
a{color:var(--accent-ink)}
.btnlink{display:inline-block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 160px}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#msg{min-height:1.4em;margin-top:6px}
.rcbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0;padding:6px 10px;border:2px dashed var(--warn);border-radius:8px;font-weight:600}
.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#stats{color:var(--mute);font-size:13px}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:12px;padding:1px 8px;margin:2px;font-size:12px}
.chips .have{border-color:var(--ok);color:var(--ok)}
.chips .miss{border-color:var(--bad);background:var(--grey);color:var(--mute)}
.chips .perk{border-color:var(--perk);color:var(--perk);font-weight:600}
.chips .blocked{border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.grouph{font-size:14px;margin:14px 0 6px}
.grouph span{color:var(--mute);font-weight:400}
.tile{background:var(--card);border:2px solid var(--line);border-radius:8px;aspect-ratio:1;position:relative;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;overflow:hidden}
/* Farben wie bei Archipelago-Trackern: in Logik = gruen, nicht in Logik = rot und innen ausgegraut */
.tile.open{border-color:var(--ok)}
.tile.locked{border-color:var(--bad);background:var(--grey)}
.tile.locked>*{opacity:.4}
.tile.done{border-color:var(--line)}
/* gelb = ueber einen Perk freigeschaltet (Dragon-Ball-Wunsch) oder geloest (Domain Expansion) */
.tile.perk{border-color:var(--perk)}
.tile .check{position:absolute;bottom:2px;right:5px;font-size:12px;color:var(--ok)}
.tile .n{position:absolute;top:3px;left:5px;font-size:10px;color:var(--mute)}
.tile .badge{position:absolute;top:3px;right:5px;font-size:10px}
.tile .q{font-size:38px;font-weight:700;color:var(--mute);line-height:1}
.tile .logo{max-width:100%;max-height:60%;object-fit:contain;flex:0 1 auto;min-height:0}
/* Silhouette: Logo komplett schwarz (im Dunkelmodus weiss) */
.tile:not(.done) .logo{filter:brightness(0)}
@media (prefers-color-scheme:dark){.tile:not(.done) .logo{filter:brightness(0) invert(1)}}
.tile .name{font-size:11px;line-height:1.2;text-align:center;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .lock{position:absolute;bottom:3px;right:5px;font-size:11px}
#tileinfo .hint{color:var(--warn)}
#tileinfo .unlocks>div{margin:6px 0}
#log{max-height:220px;overflow:auto;font-size:13px;margin:0;padding-left:18px}
#scores table{border-collapse:collapse;font-size:13px;width:100%}
#scores th,#scores td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;white-space:nowrap}
.mute{color:var(--mute)}
#hmKeys button{min-width:34px;padding:6px 0;font-weight:600}
#tpGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:3px 12px;margin-top:10px;list-style:none;padding:0}
#tpGrid li{display:flex;gap:6px;align-items:baseline;padding:3px 6px;border-radius:6px;min-width:0;font-size:14px}
#tpGrid .rk{flex:0 0 2.6em;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
#tpGrid .nm{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
#tpGrid .sc{flex:0 0 auto;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
#tpGrid li.hit{background:color-mix(in srgb,var(--ok) 16%,transparent)}
#tpGrid li.new{outline:2px solid var(--ok)}
#tpGrid li.miss .nm{color:var(--mute);font-style:italic}
#hmKeys button.hit{background:var(--ok);color:#fff;border-color:var(--ok)}
#hmKeys button.miss{background:var(--grey);color:var(--mute);text-decoration:line-through}
#hmPic line,#hmPic circle{stroke:var(--fg);stroke-width:3;fill:none;stroke-linecap:round}
#bgGrid{border-collapse:separate;border-spacing:4px;width:100%;table-layout:fixed}
#bgGrid th{font-size:12px;font-weight:600;padding:4px;text-align:center;vertical-align:middle;word-break:normal;overflow-wrap:break-word;hyphens:auto}
#bgGrid.big th{font-size:10px;padding:2px}
#bgGrid.big td{font-size:10px;height:58px}
#bgGrid.huge th{font-size:9px;padding:1px}
#bgGrid.huge td{font-size:9px;height:50px}
#bgGrid td{border:2px solid var(--line);border-radius:8px;height:64px;text-align:center;vertical-align:middle;font-size:12px;
  cursor:pointer;padding:3px;word-break:break-word;background:var(--card)}
#bgGrid .blogo{max-width:100%;max-height:40px;object-fit:contain;display:block;margin:2px auto 0}
#bgGrid .bt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#bgGrid td.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
#bgGrid td.p1{border-color:var(--p1);background:color-mix(in srgb, var(--p1) 14%, var(--card))}
#bgGrid td.p2{border-color:var(--p2);background:color-mix(in srgb, var(--p2) 14%, var(--card))}
#bgGrid td.p3{border-color:var(--p3);background:color-mix(in srgb, var(--p3) 14%, var(--card))}
#bgGrid td.p4{border-color:var(--p4);background:color-mix(in srgb, var(--p4) 14%, var(--card))}
#bgGrid td.p5{border-color:var(--p5);background:color-mix(in srgb, var(--p5) 14%, var(--card))}
#bgGrid td.p6{border-color:var(--p6);background:color-mix(in srgb, var(--p6) 14%, var(--card))}
#bgGrid td.win{box-shadow:0 0 0 3px var(--perk) inset}
#bgGrid .pmark{font-size:16px;font-weight:700;line-height:1}
/* Am PC: Bingo-Raster nicht ueber die ganze Breite ziehen, groessere Felder und Schrift */
@media (min-width:700px){
  #bgGrid{max-width:780px;margin:0 auto}
  #bgGrid th{font-size:15px;padding:6px}
  #bgGrid td{height:112px;font-size:15px}
  #bgGrid .blogo{max-height:72px}
  #bgGrid .pmark{font-size:22px}
  #bgGrid.big th{font-size:13px;padding:4px}
  #bgGrid.big td{height:96px;font-size:13px}
  #bgGrid.big .blogo{max-height:56px}
  #bgGrid.huge{max-width:900px}
  #bgGrid.huge th{font-size:12px}
  #bgGrid.huge td{height:84px;font-size:12px}
  #bgGrid.huge .blogo{max-height:48px}
  #bgGrid.giant{max-width:1080px}
  #bgGrid.giant th{font-size:11px;padding:2px}
  #bgGrid.giant td{height:66px;font-size:11px}
  #bgGrid.giant .blogo{max-height:34px}
}
#bgGrid td.p1 .pmark,.p1t{color:var(--p1)} #bgGrid td.p2 .pmark,.p2t{color:var(--p2)} #bgGrid td.p3 .pmark,.p3t{color:var(--p3)}
#bgGrid td.p4 .pmark,.p4t{color:var(--p4)} #bgGrid td.p5 .pmark,.p5t{color:var(--p5)} #bgGrid td.p6 .pmark,.p6t{color:var(--p6)}
#beGrid th{padding:3px} #beGrid select{max-width:170px;font-size:13px} #beGrid td{text-align:center;border:1px solid var(--line);min-width:50px;font-weight:600}
/* Farbenblind-Modus (Okabe-Ito-Farben): richtig = Blau, falsch = Orange, dazu Symbole */
:root.cb{--ok:#0072b2;--bad:#d55e00;--warn:#9a6a00}
@media (prefers-color-scheme:dark){:root.cb{--ok:#56b4e9;--bad:#ff9a4d;--warn:#f0c040}}
.cb .chips .miss{text-decoration:line-through}
.cb .tile.open{border-width:3px;border-style:dashed}
#cbBtn[aria-pressed="true"]{outline:2px solid var(--accent)}
#bgBoard{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0}
#bgBoard .side{border:2px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
#bgBoard .side.p1{border-color:var(--p1)} #bgBoard .side.p2{border-color:var(--p2)} #bgBoard .side.p3{border-color:var(--p3)}
#bgBoard .side.p4{border-color:var(--p4)} #bgBoard .side.p5{border-color:var(--p5)} #bgBoard .side.p6{border-color:var(--p6)}
#bgBoard .side.now{box-shadow:0 0 0 2px var(--accent) inset}
#bgBoard .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
#bgBoard .who{font-weight:600;overflow-wrap:anywhere}
#bgBoard .pl{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
#bgGrid.giant th{font-size:8px;padding:1px}
#bgGrid.giant td{font-size:8px;height:40px;border-width:1px;border-radius:5px}
#bgGrid.giant .blogo{max-height:24px}
#bgGrid.giant .pmark{font-size:12px}
#bgGrid td.dead{border-color:var(--bad);border-style:dashed;color:var(--bad);font-weight:700}
#bgGrid .rk{font-size:11px;color:var(--warn);font-weight:700}
#bgGrid.clearing td.p1,#bgGrid.clearing td.p2,#bgGrid.clearing td.p3,#bgGrid.clearing td.p4,#bgGrid.clearing td.p5,#bgGrid.clearing td.p6{cursor:crosshair;outline:2px dashed var(--bad)}
#bgGrid td.missed{border-color:var(--bad);background:var(--grey);color:var(--mute)}
.subtab{font-size:13px;padding:5px 9px;border-style:dashed}
.subtab::before{content:"↳ ";color:var(--mute)}
.subtab.active{border:1px solid var(--accent);color:var(--accent-ink);font-weight:600}
#modeOff.parent{border-color:var(--accent);color:var(--accent-ink)}
.game-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line);margin-top:10px;font-size:13px}
.game-row>span{flex:1 1 180px}
#chat{display:flex;gap:8px;margin-top:8px}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;max-width:520px;width:calc(100% - 32px)}
dialog img{max-width:160px;float:right;margin:0 0 8px 10px;border-radius:4px}
dialog li.no{color:var(--mute)}
#profDlg{max-width:820px;max-height:88vh;overflow:auto}
#profDlg h4{margin:16px 0 6px;font-size:14px}
#profDlg table{font-size:13px}
.profcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.profcard .pname{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.xpbar{height:10px;border-radius:5px;background:var(--grey);overflow:hidden;margin:6px 0 2px}
.xpbar>span{display:block;height:100%;background:var(--accent)}
.xpbar.small{height:5px;margin:4px 0 1px}
.achcat{border-top:1px solid var(--line);padding:4px 0}
.achcat summary{cursor:pointer;font-weight:600;font-size:13px;padding:4px 0}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin:6px 0}
.ach{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;opacity:.55}
.ach.got{opacity:1;border-color:var(--perk)}
.ach .ai{font-size:20px;line-height:1.2}
.ach .ad{font-size:11px;color:var(--mute)}
.filebtn{cursor:pointer}
/* Animedle: je Versuch eine Zeile, je Hinweis ein farbiges Feld */
.dlw{overflow-x:auto;margin-top:10px}
.dlt{border-collapse:separate;border-spacing:4px;min-width:820px;width:100%;table-layout:fixed}
.dlt th{font-size:12px;color:var(--mute);font-weight:600;text-align:center}
.dlt th:first-child{width:19%}
.dlt td{border-radius:6px;padding:6px 4px;text-align:center;font-size:12px;height:54px;overflow-wrap:anywhere;color:#fff;font-weight:600;line-height:1.25}
.dlt td.an{background:var(--card);color:var(--fg);border:1px solid var(--line);font-weight:700}
.dlt td.an img{display:block;max-width:100%;max-height:34px;object-fit:contain;margin:0 auto 2px}
.dlt td.g{background:#2e8b57}.dlt td.y{background:#c9a227;color:#1d1d1f}.dlt td.r{background:#b3413a}
.cb .dlt td.g{background:#0072b2}.cb .dlt td.y{background:#e69f00;color:#1d1d1f}.cb .dlt td.r{background:#555}
.dlt td .ar{font-size:15px;display:block}
/* Aufloesung (Galgenmaennchen, Animedle): Key-Art von AniList, damit man den Anime auch sieht */
.kart{display:flex;gap:14px;align-items:center;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.kart .kcov{width:120px;max-height:180px;object-fit:cover;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);flex:0 0 auto}
.kart .klogo{max-width:180px;max-height:80px;object-fit:contain;flex:0 0 auto}
.kart b{font-size:17px}
/* Wortsalat: jedes Wort eine Gruppe Buchstaben-Kacheln */
.wst{display:flex;flex-wrap:wrap;gap:14px 22px;justify-content:center;margin:16px 0 8px}
.wst .w{display:flex;gap:4px;max-width:100%}
/* Kachelbreite passt sich der Wortlaenge an (--n), damit auch lange Woerter am Handy in eine Zeile passen */
.wst .w span{width:min(34px, calc((100vw - 72px) / var(--n, 8) - 4px));height:42px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:8px;
  font:800 min(20px, calc((100vw - 72px) / var(--n, 8) * .6))/1 ui-monospace,monospace;background:var(--card)}
.wst .w span.fix{border-color:var(--ok);color:var(--ok)}
.wst.solved .w span{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
@media (max-width:500px){.wst .w{gap:3px}.wst .w span{height:32px;border-radius:6px;border-width:1.5px}.wst{gap:10px 14px}}
.clock2{font:800 20px/1 ui-monospace,monospace}
/* Vorschlagsliste unter dem Eingabefeld (Animedle) */
.acw{position:relative}
.acl{position:absolute;left:0;right:0;top:100%;z-index:20;max-height:300px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-top:2px}
.acl div{padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
.acl div.on,.acl div:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.acl .aci{width:64px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:6px;background:color-mix(in srgb,var(--fg) 6%,transparent)}
.acl img{max-width:60px;max-height:28px;object-fit:contain}
.acl small{color:var(--mute)}
.acl b{font-weight:800}
@media (max-width:500px){.dlt{min-width:680px;border-spacing:3px}.dlt td{font-size:11px;height:48px;padding:4px 3px}}
/* Fenster: Schliessen-Knopf oben rechts (bleibt beim Scrollen sichtbar) */
.dlgx{position:sticky;top:0;float:right;z-index:3;font-size:18px;line-height:1;padding:6px 10px;margin:-4px -4px 4px 8px}
#twDlg{max-width:620px;max-height:88vh;overflow:auto}
#twBar{margin:6px 0;padding:6px 10px;border:1px solid #9146ff;border-radius:8px;font-size:13px}
#twBar .twprob{color:var(--warn);font-weight:600}
#twBar .sugg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:3px 0}
#twBar .sugg button{padding:2px 8px}
#twBtn.live{outline:2px solid #9146ff}
.twico{width:18px;height:18px;vertical-align:-4px}
h3 .twico{width:22px;height:22px;vertical-align:-5px}
@media (prefers-color-scheme:dark){.twico{filter:invert(1)}}
#twBtn .dot{font-size:11px;margin-left:3px}
#twBtn .dot.on{color:var(--ok)} #twBtn .dot.wait{color:var(--mute)} #twBtn .dot.prob{color:var(--warn)}
#routeDlg{max-width:820px;max-height:88vh;overflow:auto}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.route{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.route.act{border:2px solid var(--accent)}
.route.max{border-color:var(--perk)}
.route .rh{font-size:14px;margin-bottom:2px}
.route ol{margin:2px 0 4px;padding-left:18px}
.route button{margin-top:4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);color:var(--fg);border:2px solid var(--perk);
  border-radius:10px;padding:10px 16px;box-shadow:0 4px 16px rgba(0,0,0,.3);z-index:50;font-weight:600;max-width:90vw}
footer{color:var(--mute);font-size:12px;margin-top:20px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
#tmdbLogo{height:11px;width:auto;display:block;opacity:.85}
#tmdbLink{flex:0 0 auto}
footer span[data-t="credits"]{flex:1 1 260px;min-width:0}

/* ===== 2.0: neues Layout (Night-Arcade) ===== */
.whoimg{display:flex;justify-content:center;margin:12px 0}
#whoCv{width:min(300px,72vw);height:auto;aspect-ratio:300/420;border-radius:18px;background:var(--grey)}
.whoh{margin:0 0 4px;padding-left:22px}.whoh li{margin:2px 0}
body{font:15px/1.45 "M PLUS Rounded 1c","Nunito",ui-rounded,"Hiragino Maru Gothic ProN","Segoe UI",system-ui,sans-serif}
main{max-width:1320px;padding:16px 20px 40px}
.box{border-radius:20px;padding:16px;border-color:transparent}
input,select,button,.btnlink,textarea{border-radius:12px}
input,select{min-height:42px}
button,.btnlink{min-height:42px;font-weight:700}
button.main{font-weight:800}
h1,h2,h3,h4{font-weight:800}
#topbar{min-height:52px;margin-bottom:8px}
#topbar h1{margin:0;font-size:21px;display:flex;align-items:center;gap:8px}
#topbar h1 svg{stroke:var(--accent)}
#modes>.oldtabs{display:none}
#sideNav{display:none}
#viewHead{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
#viewHead h2{margin:0;font-size:20px}
#vhBack{width:44px;height:44px;border-radius:22px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--card);border-color:transparent}
#home .hi{margin:4px 0 0;font-size:13px;color:var(--mute)}
#home h2{margin:4px 0 16px;font-size:28px;line-height:1.2}
.htiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ht{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:12px;min-height:130px;padding:16px;border-radius:22px;background:var(--card);border:0;text-align:left;color:var(--fg);text-decoration:none;font-weight:400}
.ht:hover{outline:2px solid var(--accent);outline-offset:-2px}
.ht b{display:block;font-size:18px;font-weight:800}
.ht .tx{display:block}.ht .tx>span{display:block;font-size:13px;color:var(--mute);margin-top:2px;line-height:1.35}
#topbar>span{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
#topbar>span>*{margin:0!important}#uilang{width:auto;max-width:118px}
.ht .ic{width:40px;height:40px;border-radius:20px;background:var(--grey);display:flex;align-items:center;justify-content:center}
.ht.big{grid-column:1/-1;min-height:150px;background:var(--accent);color:var(--on-accent)}
.ht.big b{font-size:24px}.ht.big .tx>span{color:inherit;opacity:.85;font-size:14px}
.ht.big .ic{background:transparent;width:auto;height:auto;border-radius:0}
.favsw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:420px}
.favsw button{height:48px;border-radius:16px;border:3px solid transparent}
.favsw button[aria-pressed="true"]{border-color:var(--fg)}
@media (min-width:1000px){
  main{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:32px;align-items:start}
  main>*,#modes>*{grid-column:2}
  #modes{display:contents}
  #sideNav{display:flex;flex-direction:column;gap:4px;grid-column:1;grid-row:1/span 60;width:220px;position:sticky;top:16px;padding-top:60px}
  .nv{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:0;border-radius:14px;background:transparent;color:var(--mute);text-decoration:none;font-size:15px;font-weight:800;text-align:left}
  .nv:hover{background:var(--card);color:var(--fg)}
  .nv.on{background:var(--card);color:var(--fg)}.nv.on svg{stroke:var(--accent)}
  #vhBack{display:none}
  .htiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .ht{min-height:170px;padding:20px}
  .ht.big{min-height:190px;padding:28px}
  #home h2{font-size:34px}
}

#topbar>span{flex:1 1 auto}
#more{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;background:transparent;border:0;padding:0}
#more>h3,#more>p,#more>details{grid-column:1/-1;margin:0}
#more>h3{display:none}
#more .opts{background:var(--card);border-radius:18px;padding:12px 16px}
#more .opts summary{cursor:pointer;font-weight:800;min-height:28px}
#more .opts[open] summary{margin-bottom:10px}
#more .opts .game-row{background:transparent;padding:8px 0 0;margin:0;border-top:1px solid var(--line);border-radius:0;flex-direction:row;flex-wrap:wrap}
#more>.game-row{background:var(--card);border:0;border-radius:20px;padding:16px;margin:0;display:flex;flex-direction:column;align-items:stretch;gap:10px}
#more>.game-row>span.mute{order:-1;flex:0 0 auto;line-height:1.4}
#more>.game-row>button,#more>.game-row>a{width:100%;text-align:center}
#more>.game-row>label{flex:0 0 auto;width:100%}
#more>.game-row>label select{width:100%}
</style>
</head>
<body>
<main>
<div id="topbar">
  <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 16l-5.2 3 1.4-5.9-4.6-4 6-.5z"></path></svg>Animepelago</h1>
  <span><button type="button" id="twBtn" style="margin-right:6px"></button><button type="button" id="profBtn" style="margin-right:6px"></button><button type="button" id="cbBtn" style="margin-right:6px" aria-pressed="false">👁</button><button type="button" id="soundBtn" aria-label="Sound" style="margin-right:6px"></button><select id="uilang" aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español (beta)</option><option value="fr">Français (beta)</option><option value="it">Italiano (beta)</option><option value="ja">日本語 (beta)</option></select></span>
</div>

<!-- Verbindung -->
<div id="modes">
  <nav id="sideNav"><button type="button" class="nv" data-go="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg><span data-t="navHome"></span></button><button type="button" class="nv" data-go="ap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg><span data-t="modeAP"></span></button><button type="button" class="nv" data-go="off"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"></rect><path d="M7 11v3M5.5 12.5h3"></path><circle cx="16" cy="11.5" r="1"></circle><circle cx="18" cy="13.5" r="1"></circle></svg><span data-t="modeOff"></span></button><button type="button" class="nv" data-go="more"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v3a2 2 0 1 0 4 0V4h6v6h-3a2 2 0 1 0 0 4h3v6h-6v-3a2 2 0 1 0-4 0v3H4z"></path></svg><span data-t="tileMore"></span></button><a href="party.html" class="nv" data-go="party"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 4.5"></path></svg><span data-t="tileParty"></span></a><button type="button" class="nv" data-go="prof"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg><span data-t="tileProf"></span></button></nav>
  <div id="viewHead" class="hide"><button type="button" id="vhBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><h2 id="vhTitle"></h2></div>
  <div id="home"><p class="hi" id="homeHi"></p><h2 data-t="homeQ"></h2><div class="htiles"><button type="button" class="ht big" data-go="ap"><span class="ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg></span><span class="tx"><b data-t="modeAP"></b><span data-t="tileAPd"></span></span></button><button type="button" class="ht" data-go="off"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--i1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"></rect><path d="M7 11v3M5.5 12.5h3"></path><circle cx="16" cy="11.5" r="1"></circle><circle cx="18" cy="13.5" r="1"></circle></svg></span><span class="tx"><b data-t="modeOff"></b><span data-t="tileOffd"></span></span></button><button type="button" class="ht" data-go="more"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--i2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v3a2 2 0 1 0 4 0V4h6v6h-3a2 2 0 1 0 0 4h3v6h-6v-3a2 2 0 1 0-4 0v3H4z"></path></svg></span><span class="tx"><b data-t="tileMore"></b><span data-t="tileMored"></span></span></button><a href="party.html" class="ht" data-go="party"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--i3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 4.5"></path></svg></span><span class="tx"><b data-t="tileParty"></b><span data-t="tilePartyd"></span></span></a><button type="button" class="ht" data-go="prof"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--i4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg></span><span class="tx"><b data-t="tileProf"></b><span data-t="tileProfd"></span></span></button></div></div>
  <div class="row oldtabs"><button type="button" id="modeAP" class="main" style="flex:0 0 auto" data-t="modeAP"></button>
  <button type="button" id="modeOff" style="flex:0 0 auto" data-t="modeOff"></button>
  <button type="button" id="modeMore" class="subtab hide" style="flex:0 0 auto" data-t="modeMore"></button>
</div>
</div>
<div id="connect" class="box">
  <div class="row">
    <label><span data-t="server"></span><input id="host" required autocomplete="off" placeholder="archipelago.gg"></label>
    <label style="flex:0 1 110px"><span data-t="port"></span><input id="port" type="number" min="1" max="65535" placeholder="38281"></label>
    <label><span data-t="slot"></span><input id="slot" required autocomplete="off"></label>
    <label><span data-t="password"></span><input id="password" type="password" autocomplete="off"></label>
    <button type="button" class="main" id="go" style="flex:0 0 auto" data-t="connect"></button>
  </div>
  <div id="cmsg"></div>
  <p style="margin:12px 0 0;font-size:13px;color:var(--mute)"><span data-t="noYaml"></span> <a id="yamlLink" class="btnlink" href="Animepelago.yaml" download="Animepelago.yaml" target="_blank" rel="noopener" data-t="yamlBtn"></a></p>
</div>
<div id="offline" class="box hide">
  <div class="row">
    <label><span data-t="oCount"></span><input id="oCount" type="number" min="10" value="50"></label>
    <label><span data-t="oGoalType"></span><select id="oGoalType"><option value="anime" data-t="oGoalAnime"></option><option value="exodia">Exodia</option><option value="genre_master" data-t="oGoalGM"></option></select></label>
    <label><span data-t="oGoal"></span><input id="oGoal" type="number" min="1" value="40"></label>
  </div>
  <div class="row">
    <label><span data-t="oUnlock"></span><select id="oUnlock"><option value="both" data-t="oBoth"></option><option value="genres" data-t="oGenres"></option><option value="letters" data-t="oLetters"></option></select></label>
    <label><span data-t="oLang"></span><select id="oLang"></select></label>
    <label><span data-t="oRule"></span><select id="oRule"><option value="any" data-t="oAny"></option><option value="all" data-t="oAll"></option></select></label>
    <label><span data-t="oOnly"></span><select id="oOnly"><option value="" data-t="oOnlyAll"></option></select></label>
    <label id="oOnlyStartBox" class="hide"><span data-t="oOnlyStart"></span><input id="oOnlyStart" type="number" min="2" max="8" value="3"></label>
    <label><span data-t="oGeass"></span><input id="oGeass" type="number" min="0" max="50" value="10"></label>
    <label><span data-t="oArrows"></span><input id="oArrows" type="number" min="0" max="100" value="10"></label>
  </div>
  <div class="row" style="align-items:center">
    <label style="flex:0 1 auto"><input id="oDemo" type="checkbox" checked style="width:auto"> <span data-t="oDemo"></span></label>
    <label style="flex:0 1 auto"><input id="oPerks" type="checkbox" checked style="width:auto"> <span data-t="oPerks"></span></label>
    <label style="flex:0 1 auto"><input id="oTraps" type="checkbox" checked style="width:auto"> <span data-t="oTraps"></span></label>
  </div>
  <div class="row" style="align-items:center">
    <span data-t="oExtras" style="flex:0 0 auto;font-size:13px;color:var(--mute)"></span>
    <label style="flex:0 1 auto"><input id="oxYear" type="checkbox" style="width:auto"> <span data-t="cat_year"></span></label>
    <label style="flex:0 1 auto"><input id="oxSource" type="checkbox" style="width:auto"> <span data-t="cat_source"></span></label>
    <label style="flex:0 1 auto"><input id="oxSeason" type="checkbox" style="width:auto"> <span data-t="cat_season"></span></label>
    <label style="flex:0 1 auto"><input id="oxStudio" type="checkbox" style="width:auto"> <span data-t="cat_studio"></span></label>
  </div>
  <div class="row">
    <button type="button" class="main" id="oNew" style="flex:0 0 auto" data-t="oNew"></button>
    <button type="button" id="oContinue" class="hide" style="flex:0 0 auto" data-t="oContinue"></button>
  </div>
  <div id="omsg"></div>
  <h3 data-t="scoresTitle" style="font-size:15px;margin:16px 0 6px"></h3>
  <div id="scores" style="overflow-x:auto"></div>
</div>

<!-- Weitere: Minispiele mit eigenen Einstellungen -->
<div id="more" class="box hide">
  <h3 style="font-size:15px;margin:0 0 4px" data-t="moreTitle"></h3>
  <p class="mute" style="font-size:13px;margin:0 0 8px" data-t="moreInfo"></p>
  <details class="opts"><summary data-t="optsMore"></summary>
  <div class="row">
    <label><span data-t="oPool"></span><input id="mPool" type="number" min="50" value="500"></label>
    <label><span data-t="oLang"></span><select id="mLang"></select></label>
    <label><span data-t="oOnly"></span><select id="mOnly"><option value="" data-t="oOnlyAll"></option></select></label>
  </div>
  <!-- Bingo: welche Themen-Arten an Zeilen und Spalten vorkommen duerfen (der Spieler waehlt selbst) -->
  <div class="game-row" id="bgThemes" style="gap:4px 14px;justify-content:flex-start;padding-top:0;border-top:0">
    <span class="mute" data-t="bgThemes" style="flex:0 0 auto"></span>
    <label style="flex:0 1 auto"><input type="checkbox" data-th="g" checked style="width:auto"> <span data-t="th_g"></span></label>
    <label style="flex:0 1 auto"><input type="checkbox" data-th="d" checked style="width:auto"> <span data-t="th_d"></span></label>
    <label style="flex:0 1 auto"><input type="checkbox" data-th="s" checked style="width:auto"> <span data-t="th_s"></span></label>
    <label style="flex:0 1 auto"><input type="checkbox" data-th="src" checked style="width:auto"> <span data-t="th_src"></span></label>
    <label style="flex:0 1 auto"><input type="checkbox" data-th="dec" checked style="width:auto"> <span data-t="th_dec"></span></label>
    <label style="flex:0 1 auto"><input type="checkbox" data-th="sea" checked style="width:auto"> <span data-t="th_sea"></span></label>
    <label style="flex:0 1 auto"><input type="checkbox" data-th="y" checked style="width:auto"> <span data-t="th_y"></span></label>
    <label style="flex:0 1 auto"><input type="checkbox" data-th="l" checked style="width:auto"> <span data-t="th_l"></span></label>
  </div>
  </details>
  <div class="game-row">
    <button type="button" id="hmStart" class="main" data-t="hmStart"></button>
    <span class="mute" data-t="hmDesc"></span>
  </div>
  <div class="game-row">
    <button type="button" id="whoEndless" class="main" data-t="whoEndless"></button>
    <button type="button" id="whoDaily" data-t="whoDaily"></button>
    <button type="button" id="whoTimed" data-t="whoTimed"></button>
    <label><span data-t="whoAsk"></span><select id="whoAsk"><option value="char" data-t="whoAskChar"></option><option value="anime" data-t="whoAskAnime"></option></select></label>
    <label><span data-t="whoGender"></span><select id="whoGender"><option value="" data-t="whoGAll"></option><option value="f" data-t="whoGF"></option><option value="m" data-t="whoGM"></option><option value="nb" data-t="whoGNB"></option></select></label>
    <span class="mute" data-t="whoDesc"></span>
  </div>
  <div class="game-row">
    <button type="button" id="wsEndless" class="main" data-t="wsEndless"></button>
    <button type="button" id="wsTimed" data-t="wsTimed"></button>
    <span class="mute" data-t="wsDesc"></span>
  </div>
  <div class="game-row">
    <button type="button" id="dlDaily" class="main" data-t="dlDaily"></button>
    <button type="button" id="dlEndless" data-t="dlEndless"></button>
    <span class="mute" data-t="dlDesc"></span>
  </div>
  <div class="game-row">
    <button type="button" id="bgStart" class="main" data-t="bgStart"></button>
    <label style="flex:0 0 auto;margin:0"><span data-t="bgSizeLbl"></span><select id="bgSize"><option value="3" data-t="bgSize3"></option><option value="4" data-t="bgSize4"></option><option value="5" data-t="bgSize5"></option><option value="6x7" data-t="bgSize67"></option></select></label>
    <span class="mute" data-t="bgDesc"></span>
  </div>
  <!-- Risiko-Bingo: grosse Boards (7x7-10x10), man kann sich selbst aussperren -->
  <div class="game-row hide" id="riskRow">
    <button type="button" id="riskStart" class="main" data-t="rkStart"></button>
    <label style="flex:0 0 auto;margin:0"><span data-t="bgSizeLbl"></span><select id="rkSize"><option value="7">7×7</option><option value="8">8×8</option><option value="9">9×9</option><option value="10" selected>10×10</option></select></label>
    <label style="flex:0 0 auto;margin:0"><span data-t="rkMinLbl"></span><select id="rkMin"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
    <label style="flex:0 0 auto;margin:0"><span data-t="rkHintLbl"></span><select id="rkHint"><option value="1" data-t="rkHintOn"></option><option value="0" data-t="rkHintOff"></option></select></label>
    <span class="mute" data-t="rkDesc"></span>
  </div>
  <div class="game-row">
    <button type="button" id="seedStart" class="main" data-t="bgEditorStart"></button>
    <span class="mute" data-t="bgEditorDesc"></span>
  </div>
  <div class="game-row">
    <a class="btnlink" href="party.html" style="background:var(--accent);color:var(--on-accent);border-color:var(--accent)" data-t="partyStart"></a>
    <span class="mute" data-t="partyDesc"></span>
  </div>
  <div class="game-row">
    <button type="button" id="taStart" class="main" data-t="bgTAStart"></button>
    <span class="mute" data-t="bgTADesc"></span>
  </div>
  <!-- Top 100: die bestbewerteten Anime bei AniList erraten (alle Zeiten oder ein Genre) -->
  <div class="game-row" id="tpRow">
    <button type="button" id="tpStart" class="main" data-t="tpStart"></button>
    <label style="flex:0 0 auto;margin:0"><span data-t="tpList"></span><select id="tpList"></select></label>
    <span class="mute" data-t="tpDesc"></span>
  </div>
</div>

<!-- Galgenmaennchen (Minispiel) -->
<section id="hangman" class="hide">
  <div class="box">
    <div class="row" style="align-items:center">
      <b style="flex:1 1 auto" data-t="hmTitle"></b>
      <span id="hmScore" class="mute" style="flex:0 0 auto"></span>
      <button type="button" id="hmBack" style="flex:0 0 auto" data-t="yBack"></button>
    </div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px">
      <svg id="hmPic" viewBox="0 0 120 130" width="120" height="130" aria-hidden="true"></svg>
      <div style="flex:1 1 200px">
        <div id="hmWord" style="font:600 22px/1.5 monospace;letter-spacing:2px;word-break:break-word"></div>
        <div id="hmHint" class="mute" style="font-size:13px;margin-top:4px"></div>
        <div id="hmMsg" style="margin-top:6px"></div>
      </div>
    </div>
    <div id="hmReveal" class="hide"></div>
    <div id="hmKeys" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:10px"></div>
    <div class="row" style="margin-top:10px">
      <input id="hmGuess" autocomplete="off" style="flex:4 1 200px">
      <button type="button" id="hmSolve" style="flex:0 0 auto" data-t="hmSolve"></button>
      <button type="button" id="hmNext" class="main hide" style="flex:0 0 auto" data-t="hmNext"></button>
    </div>
  </div>
</section>

<!-- Wortsalat: Buchstaben des Titels gemischt, Wort fuer Wort -->
<section id="who" class="hide">
  <div class="box">
    <div class="row" style="align-items:center">
      <b id="whoHead" style="flex:1 1 auto"></b>
      <span id="whoClock" class="clock2" style="flex:0 0 auto"></span>
      <span id="whoScore" class="mute" style="flex:0 0 auto"></span>
      <button type="button" id="whoBack" style="flex:0 0 auto" data-t="yBack"></button>
    </div>
    <div class="whoimg"><canvas id="whoCv" width="300" height="420" role="img"></canvas></div>
    <ol id="whoHints" class="whoh"></ol>
    <div class="row" style="margin-top:8px">
      <div class="acw" style="flex:4 1 200px"><input id="whoGuess" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="whoList" aria-expanded="false" style="width:100%"><div id="whoList" class="ac hide" role="listbox"></div></div>

    const seed = str(e.truckSeed, 40); if (seed) s.effects.truckSeed = seed;

}
// Sicherheit: slot_data kommt vom Server. Zahlen werden zu echten Zahlen, Listen nur mit bekannten Werten.
// So kann nichts Fremdes (z. B. HTML-Code) in die Anzeige gelangen.
function cleanSlotData(sd){
  if (!sd || typeof sd !== "object" || !Array.isArray(sd.anime)) return null;
  const c = Object.create(null), ids = sd.anime.filter(isId).slice(0, 20000), idSet = new Set(ids.map(String));
  const pick = (v, allowed) => Array.isArray(v) ? v.filter(x => allowed.includes(x)) : [];
  const perId = (obj, f) => { const o = Object.create(null);
    if (obj && typeof obj === "object") for (const k of Object.keys(obj)) if (idSet.has(k)) { const v = f(obj[k]); if (v != null) o[k] = v; }
    return o; };
  c.anime = ids;
  c.data_version = num(sd.data_version, 0, 1e9);
  c.location_offset = num(sd.location_offset, 0, 9e15, 7418000000);
  c.milestones = Array.isArray(sd.milestones) ? sd.milestones.map(m => num(m, 0, 1e6)).slice(0, 1000) : [];
  c.goal = ["anime","exodia","genre_master"].includes(sd.goal) ? sd.goal : "anime";
  c.genre_master_genres = num(sd.genre_master_genres, 0, 100);
  c.genre_master_anime = num(sd.genre_master_anime, 0, 1000);
  c.anime_goal = num(sd.anime_goal, 0, 20000);
  c.unlock_mode = ["both","genres","letters","none"].includes(sd.unlock_mode) ? sd.unlock_mode : "both";
  c.title_language = /^[a-z]{2,20}$/.test(sd.title_language) ? sd.title_language : "english";
  c.letter_language = /^[a-z]{2,20}$/.test(sd.letter_language) ? sd.letter_language : c.title_language;
  c.genre_rule = sd.genre_rule === "all" ? "all" : "any";
  c.genre_step = num(sd.genre_step, 0, 100);
  c.demographics = sd.demographics === true;
  c.only_genres = pick(sd.only_genres, GENRES);
  c.start_genres = pick(sd.start_genres, GENRES);
  c.start_letters = pick(sd.start_letters, LETTERS);
  c.extra_unlocks = pick(sd.extra_unlocks, EXTRA.map(e => e.key));
  c.start_extra = Object.create(null);
  for (const k of c.extra_unlocks) c.start_extra[k] = pick(sd.start_extra?.[k], EXTRA_BY[k].values);
  c.extra_any = perId(sd.extra_any, v => { if (!v || typeof v !== "object") return null; const o = {};
    for (const k of c.extra_unlocks) if (Array.isArray(v[k])) { const l = v[k].filter(x => EXTRA_BY[k].values.includes(x)); if (l.length) o[k] = l; }
    return o; });
  c.extra_values = perId(sd.extra_values, v => { if (!v || typeof v !== "object") return null; const o = {};
    for (const k of c.extra_unlocks) if (EXTRA_BY[k].values.includes(v[k])) o[k] = v[k];
    return o; });
  c.letters = perId(sd.letters, v => LETTERS.includes(v) ? v : null);
  c.trap_link = sd.trap_link === true;
  c.death_link = sd.death_link === true;
  for (const k of ["sukuna_fingers","dragon_balls","geass","stand_arrows"]) c[k] = num(sd[k], 0, 1000);
  c.clow_cards = num(sd.clow_cards, 0, 53);
  return c;
}

function cmsg(text, cls){ $("cmsg").textContent = text; $("cmsg").className = cls||""; }

function tryOpen(url){
  return new Promise(resolve => {
    let ws; try { ws = new WebSocket(url); } catch(e){ return resolve(false); }
    let opened = false;
    const timer = setTimeout(() => { if(!opened){ ws.close(); resolve(false);} }, 8000);
    ws.onopen = () => { opened = true; clearTimeout(timer); G.ws = ws; resolve(true); };
    ws.onerror = () => { if(!opened){ clearTimeout(timer); resolve(false);} };
    ws.onclose = () => { if (opened && G.ws === ws) onClosed(); };
    ws.onmessage = ev => {
      // Sicherheit: kaputte Nachrichten duerfen das Spiel nicht zum Absturz bringen
      let msgs; try { msgs = JSON.parse(ev.data); } catch(e) { console.warn("Unlesbare Nachricht", e); return; }
      if (!Array.isArray(msgs)) return;
      for (const msg of msgs) { try { if (msg && typeof msg === "object") handle(msg); } catch(e) { console.error("Fehler bei", msg?.cmd, e); } }
    };
  });
}
// Vor "Connected" duerfen nur die Anmelde-Befehle raus. Waehrend die Verbindung weg ist, werden
// Spielstand, Checks und Ziel gesammelt und nach dem Neuverbinden nachgeschickt (nichts geht verloren).
const HANDSHAKE = new Set(["GetDataPackage", "Connect"]), KEEP = new Set(["Set", "LocationChecks", "StatusUpdate", "Say"]);
function send(...cmds){
  if (G.offline) { OFFLINE.receive(cmds); return; }
  const open = G.ws && G.ws.readyState === 1;
  const now = cmds.filter(c => open && (G.connected || HANDSHAKE.has(c.cmd)));
  if (now.length) G.ws.send(JSON.stringify(now));
  if (G.reconnecting) G.queue = [...(G.queue || []), ...cmds.filter(c => !now.includes(c) && KEEP.has(c.cmd))].slice(-500);
}
function onClosed(){
  G.ws = null; G.connected = false; $("go").disabled = false;
  // Mitten im Spiel unerwartet getrennt: automatisch neu verbinden, Spiel bleibt offen
  if (!$("game").classList.contains("hide") && !G.offline && !G.leaving && G.url && G.slotData) { reconnect(); return; }
  if (!$("game").classList.contains("hide") && !G.refusedNow) { say(t("closed"), "bad"); log(t("closed")); }
  G.refusedNow = false; setMode("ap");
}
// ---------- Automatisch neu verbinden ----------
// Wartezeiten 2, 4, 8, 15, dann alle 30 Sekunden; nach 30 Versuchen (~13 Minuten) nur noch per Knopf.
const RC = {active: false, tries: 0, timer: null, tick: null}, RC_WAIT = [2, 4, 8, 15, 30], RC_MAX = 30;
function rcShow(text){ $("reconn").classList.remove("hide"); $("reconnTxt").textContent = text; }
function rcLock(on){ $("guess").disabled = $("send").disabled = on; }
function reconnect(){
  if (!RC.active) { RC.active = true; G.reconnecting = true; RC.tries = 0; rcLock(true); log(t("closed")); sfx("bad"); }
  rcSchedule();
}
function rcSchedule(){
  clearTimeout(RC.timer); clearInterval(RC.tick);
  if (RC.tries >= RC_MAX) { rcShow(t("reconnGaveUp")); return; }
  let s = RC_WAIT[Math.min(RC.tries, RC_WAIT.length - 1)];
  rcShow(t("reconnWait", s, RC.tries + 1));
  RC.tick = setInterval(() => { s--; if (s > 0) rcShow(t("reconnWait", s, RC.tries + 1)); }, 1000);
  RC.timer = setTimeout(rcAttempt, s * 1000);
}
async function rcAttempt(){
  clearTimeout(RC.timer); clearInterval(RC.tick);
  if (!RC.active || G.ws) return;
  RC.tries++; rcShow(t("reconnTrying"));
  if (await tryOpen(G.url)) return;  // weiter bei "Connected" (oder onClosed, falls der Server gleich wieder trennt)
  if (RC.active && !G.ws) rcSchedule();
}
function reconnectDone(){
  if (!RC.active) return;
  RC.active = false; G.reconnecting = false; RC.tries = 0; clearTimeout(RC.timer); clearInterval(RC.tick);
  rcLock(false); rcShow(t("reconnOk")); log(t("reconnOk")); sfx("item");
  setTimeout(() => { if (!RC.active) $("reconn").classList.add("hide"); }, 3000);
}
function stopReconnect(silent){
  const was = RC.active;
  RC.active = false; G.reconnecting = false; G.queue = []; clearTimeout(RC.timer); clearInterval(RC.tick);
  rcLock(false); $("reconn").classList.add("hide");
  return was && !silent;
}
$("reconnNow").onclick = () => { if (!RC.active) return; if (RC.tries >= RC_MAX) RC.tries = RC_MAX - 1; rcAttempt(); };
$("reconnStop").onclick = () => { stopReconnect(); $("leave").click(); };
// Internet wieder da oder Tab wieder sichtbar: sofort versuchen statt zu warten
window.addEventListener("online", () => { if (RC.active && !G.ws) rcAttempt(); });

function uuid(){ let u = store.get("ap_uuid"); if(!u){ u = Math.random().toString(36).slice(2)+Date.now().toString(36); store.set("ap_uuid", u);} return u; }

// ---------- Nachrichten vom Server ----------
function handle(msg){
  switch (msg.cmd) {
    case "RoomInfo":
      G.seed = msg.seed_name;
      send({cmd:"GetDataPackage", games: msg.games});
      send({cmd:"Connect", game:"Animepelago", name:$("slot").value.trim(), password:$("password").value, uuid:uuid(),
        version:{major:0, minor:6, build:8, class:"Version"}, items_handling:0b111, tags:[], slot_data:true});
      break;
    case "DataPackage":
      for (const [game, d] of Object.entries(msg.data?.games || {}))
        if (d?.item_name_to_id && d?.location_name_to_id) G.dp[game] = {items:Object.fromEntries(Object.entries(d.item_name_to_id).map(([n,i])=>[i,n])),
                      locs:Object.fromEntries(Object.entries(d.location_name_to_id).map(([n,i])=>[i,n]))};
      break;
    case "ConnectionRefused":
      cmsg(t("refused", (msg.errors||[]).join(", ")), "bad");
      if (stopReconnect()) { say(t("refused", (msg.errors||[]).join(", ")), "bad"); log(t("refused", (msg.errors||[]).join(", "))); G.refusedNow = true; }
      G.leaving = true; G.ws.close(); break;
    case "Connected": onConnected(msg); break;
    case "ReceivedItems":
      if (msg.index === 0) G.items = [];
      else if (msg.index !== G.items.length) { send({cmd:"Sync"}); break; }
      if (!Array.isArray(msg.items)) break;
      // Sicherheit: nur gueltige Eintraege, hoechstens 100 000 Items (schuetzt vor Speicher-Ueberlauf)
      for (const it of msg.items) if (it && Number.isSafeInteger(it.item) && G.items.length < 100000) G.items.push(it);
      if (G.state) processItems(); else G.pendingItems = true;
      render(); break;
    case "RoomUpdate":
      if (Array.isArray(msg.checked_locations)) { msg.checked_locations.filter(Number.isSafeInteger).forEach(l => G.checked.add(l)); render(); checkGoal(); }
      if (msg.players) G.players = msg.players;
      break;
    case "Retrieved":
      if (msg.keys && typeof msg.keys === "object" && Object.hasOwn(msg.keys, stateKey()) && !G.state) {
        G.state = cleanState(msg.keys[stateKey()]);
        if (!G.state.ownKnown) { G.state.own = G.anime.filter(isDone).map(a => a.id); G.state.ownKnown = true; saveState(); }
        G.ownSet = new Set(G.state.own);
        processItems(); render(); checkGoal();
      }
      break;
    case "PrintJSON": log(printJSON(msg)); break;
    case "Bounced": {
      const tags = Array.isArray(msg.tags) ? msg.tags : [], data = (msg.data && typeof msg.data === "object") ? msg.data : {};
      if (!tags.includes("DeathLink") && !tags.includes("TrapLink")) break;
      // Sicherheit/Fairness: hoechstens 10 DeathLinks/TrapLinks pro Minute, der Rest wird ignoriert
      const now = Date.now(); G.linkTimes = (G.linkTimes || []).filter(x => x > now - 60000);
      if (G.linkTimes.length >= 10) break;
      G.linkTimes.push(now);
      data.source = typeof data.source === "string" ? data.source.slice(0, 60) : "?";
      if (tags.includes("DeathLink") && G.slotData?.death_link) onDeathLink(data);
      if (tags.includes("TrapLink") && G.slotData?.trap_link) onTrapLink(data);
      break; }
  }
}

function onConnected(msg){
  const sd = cleanSlotData(msg.slot_data);
  if (!sd) { cmsg(t("wrongGame"), "bad"); if (G.ws) G.ws.close(); return; }
  G.connected = true;
  const wasWon = G.reconnecting && G.wonSent;  // nach dem Neuverbinden nicht nochmal "Ziel erreicht" feiern
  G.slotData = sd; G.slot = num(msg.slot, 0, 1e6); G.team = num(msg.team, 0, 1e6);
  G.players = Array.isArray(msg.players) ? msg.players : []; G.slotInfo = (msg.slot_info && typeof msg.slot_info === "object") ? msg.slot_info : {};
  G.checked = new Set((Array.isArray(msg.checked_locations) ? msg.checked_locations : []).filter(Number.isSafeInteger)); G.state = null; G.won = false; G.wonSent = wasWon; G.ownSet = new Set();
  G.anime = sd.anime.map(id => BY_ID.get(id)).filter(Boolean);
  // Kachel-Nummern in einer festen, zufaellig wirkenden Reihenfolge, damit die Sortierung nichts verraet.
  const order = [...G.anime].sort((a,b) => hash(G.seed+":"+a.id) - hash(G.seed+":"+b.id));
  G.number = new Map(order.map((a,i) => [a.id, i+1]));
  G.anime = order;
  const tags = [...(sd.death_link ? ["DeathLink"] : []), ...(sd.trap_link ? ["TrapLink"] : [])];
  if (tags.length) send({cmd:"ConnectUpdate", items_handling:0b111, tags});
  // Nach dem Neuverbinden: gesammelte Befehle zuerst nachschicken (Spielstand vor dem "Get"), dann weiter wie gewohnt
  if (G.queue && G.queue.length) { const q = G.queue; G.queue = []; G.ws.send(JSON.stringify(q)); }
  reconnectDone();
  send({cmd:"Get", keys:[stateKey()]});
  ["connect","offline","modes"].forEach(id => $(id).classList.add("hide")); $("game").classList.remove("hide"); cmsg("");
  $("chat").classList.toggle("hide", !!G.offline);
  if (G.anime.length < sd.anime.length || sd.data_version > DB.meta.version)
    say(t("dataOld", DB.meta.version, sd.data_version), "warn");
  $("letterrow").classList.toggle("hide", !usesLetters(sd));
  $("genrerow").classList.toggle("hide", !usesGenres(sd));
  $("guess").focus();
  render();
  const o0 = owned(), first = G.anime.filter(a => isDone(a) || canGuess(a, o0)), rest = G.anime.filter(a => !first.includes(a));
  LIVE.need([...first, ...rest].map(a => a.id));
}
function saveState(){ send({cmd:"Set", key:stateKey(), default:{}, want_reply:false, operations:[{operation:"replace", value:G.state}]}); }

// ---------- Items ----------
const count = id => G.items.filter(i => i.item === id).length;
function owned(){
  const now = Date.now(), sd = G.slotData, st = G.state || freshState();
  const genres = new Set(sd.start_genres), letters = new Set(sd.start_letters);
  const extra = Object.fromEntries(EXTRA.map(e => [e.key, new Set(sd.start_extra?.[e.key] || [])]));
  for (const it of G.items) {
    const o = it.item - ITEM;
    if (o >= 0 && o < GENRES.length) genres.add(GENRES[o]);
    if (o >= 500 && o < 500 + LETTERS.length) letters.add(LETTERS[o-500]);
    for (const e of EXTRA) if (o >= e.offset && o < e.offset + e.values.length) extra[e.key].add(e.values[o - e.offset]);
  }
  // Wunsch-Genre (Dragon Balls) nur als Perk markieren, solange das echte Item noch fehlt
  const perkGenre = st.wish && !genres.has(st.wish) ? st.wish : null;
  if (st.wish) genres.add(st.wish);
  const active = st.blocks.filter(b => b.until > now).map(b => b.genre ? {kind:"genre", value:b.genre} : b);
  const blockedOf = kind => new Set(active.filter(b => b.kind === kind).map(b => b.value));
  const blocked = blockedOf("genre"), blockedLetters = blockedOf("letter");
  const blockedExtra = Object.fromEntries(EXTRA.map(e => [e.key, blockedOf(e.key)]));
  return {genres, letters, extra, blocked, blockedLetters, blockedExtra, perkGenre};
}
function processItems(){
  // Effekte nur fuer neue Items (Index > gespeicherter Stand), damit nach Neuverbinden nichts doppelt passiert.
  const st = G.state; let changed = false;
  for (let i = st.done; i < G.items.length; i++) {
    const id = G.items[i].item, from = playerName(G.items[i].player);
    if (id === SUKUNA) { const h = makeHint(i); if (h) { st.hints.push(h); log(t("hint", G.number.get(h.id), hintText(h))); } }
    // Alle Clow Cards beisammen: nur eine Erfolgsmeldung (keine Wirkung)
    if (id === CLOW && G.slotData.clow_cards && G.items.slice(0, i + 1).filter(x => x.item === CLOW).length === G.slotData.clow_cards) {
      log(t("clowAll", G.slotData.clow_cards)); sfx("win"); PROF.ev("clow");
    }
    if (TRAPS[id]) { hitByTrap(TRAPS[id]); sendTrapLink(TRAPS[id]); }
    else if (id - ITEM < 100 || (id - ITEM >= 500 && id - ITEM < 1000)) sfx("item");
    if (id === DEATHNOTE && G.slotData.death_link) {
      send({cmd:"Bounce", tags:["DeathLink"], data:{time:Date.now()/1000, source:playerName(G.slot), cause:`${playerName(G.slot)} found a Death Note.`}});
      log(t("deathSent"));
    }
    changed = true;
  }
  st.done = G.items.length;
  // Wartende Fallen: vielleicht ist durch die neuen Items jetzt etwas sperrbar
  if (applyQueuedBlocks()) changed = true;
  if (changed) saveState();
}
// Falle: sperrt ein zufaelliges freigeschaltetes Item fuer einige Sekunden.
// Genres, wenn sie in dieser Welt zaehlen; sonst Buchstaben (z. B. bei Only Genres); sonst Jahr/Vorlage/...
// Das letzte freie wird nie gesperrt (sonst stuende das Spiel still); dann wartet die Falle in der Warteschlange.
// ---------- Fallen und Hilfen ----------
// Fallen: Kira's Hand (sperrt), Isekai Truck (mischt Felder), Filler Arc (blendet Infos aus), Tsundere (lehnt einmal ab)
const TRAPS = {[KIRA]:"Kira's Hand", [TRUCK]:"Isekai Truck", [FILLER]:"Filler Arc", [TSUNDERE]:"Tsundere"};
const TRAP_SECONDS = {"Isekai Truck":60, "Filler Arc":60, "Tsundere":30};
const effectLeft = name => { const u = G.state?.effects?.[name] || 0; return Math.max(0, Math.ceil((u - Date.now()) / 1000)); };
const leapsLeft = () => G.state ? Math.max(0, count(TIMELEAP) - (G.state.leapUsed || 0)) : 0;
const senzuLeft = () => G.state ? Math.max(0, count(SENZU) - (G.state.senzuUsed || 0)) : 0;
function hitByTrap(name, from){
  const st = G.state; st.effects = st.effects || {};
  if (leapsLeft() > 0) { st.leapUsed = (st.leapUsed || 0) + 1; log(t("leapSaved", t("trap_" + name))); sfx("leap"); PROF.ev("leap"); return; }
  sfx("trap"); PROF.ev("trap", {k: name});
  if (name === "Kira's Hand") {
    const g = blockRandom(60); if (g) log(t("kira", g)); else queueBlock(60, "kira");
    return;
  }
  st.effects[name] = Date.now() + TRAP_SECONDS[name] * 1000;
  if (name === "Isekai Truck") st.effects.truckSeed = Math.random().toString(36).slice(2);
  if (name === "Tsundere") st.tsunSeen = [];
  log(t("trapHit_" + name.replace(/\W/g, ""), from || ""));
}
// TrapLink: eigene Fallen an andere Spiele weitergeben, fremde Fallen als eine von unseren empfangen
function sendTrapLink(name){
  if (!G.slotData?.trap_link || G.offline) return;
  send({cmd:"Bounce", tags:["TrapLink"], data:{time:Date.now()/1000, source:playerName(G.slot), trap_name:name}});
}
function onTrapLink(data){
  if (!G.state || data.source === playerName(G.slot)) return;
  const ours = Object.values(TRAPS);
  const name = ours.includes(data.trap_name) ? data.trap_name : ours[Math.floor(Math.random() * ours.length)];
  log(t("trapLinkIn", data.source || "?", typeof data.trap_name === "string" ? data.trap_name.slice(0, 60) : "?"));

// Senzu-Bohne: beendet alle laufenden Fallen-Wirkungen
function anyTrapActive(){
  const st = G.state; if (!st) return false;
  return st.blocks.some(b => b.until > Date.now()) || (st.queued || []).length > 0 ||
         Object.keys(TRAP_SECONDS).some(n => effectLeft(n) > 0);
}
function useSenzu(){
  if (senzuLeft() <= 0 || !anyTrapActive()) return;
  const st = G.state; st.senzuUsed = (st.senzuUsed || 0) + 1;
  st.blocks = []; st.queued = []; st.effects = {}; st.tsunSeen = [];
  saveState(); log(t("senzuUsed")); sfx("item"); render(); PROF.ev("perk", {k: "senzu"});
}
function blockRandom(seconds){
  const o = owned(), sd = G.slotData;
  let kind = null, free = [];
  if (usesGenres(sd)) { kind = "genre"; free = [...o.genres].filter(g => !o.blocked.has(g)); }
  else if (usesLetters(sd)) { kind = "letter"; free = [...o.letters].filter(l => !o.blockedLetters.has(l)); }
  else for (const e of activeExtras()) {
    const f = [...o.extra[e.key]].filter(v => !o.blockedExtra[e.key].has(v));
    if (f.length >= 2) { kind = e.key; free = f; break; }
  }
  if (free.length < 2) return null;
  const value = free[Math.floor(Math.random()*free.length)];
  G.state.blocks = G.state.blocks.filter(b => b.until > Date.now());
  G.state.blocks.push({kind, value, until:Date.now()+seconds*1000});
  return kind === "genre" ? value : kind === "letter" ? t("letterN", value) : `${t("cat_" + kind)} ${value}`;
}
// Restzeit einer Sperre in Sekunden (0 = nicht gesperrt)
function blockLeft(kind, value){
  const now = Date.now(), b = (G.state?.blocks||[]).find(b => (b.genre ? b.genre === value && kind === "genre" : b.kind === kind && b.value === value) && b.until > now);
  return b ? Math.ceil((b.until - now) / 1000) : 0;
}
function onDeathLink(data){
  if (data.source === playerName(G.slot)) return;
  // Vorlaeufige Wirkung: ein zufaelliges Genre 1 Minute sperren.
  if (!G.state) return;
  const g = blockRandom(60);
  if (g) log(t("deathRecv", data.source || "?", g)); else queueBlock(60, "death", data.source || "?");
  saveState(); render();
}
// Warteschlange: ist gerade nichts sperrbar (nichts freigeschaltet oder alles schon gesperrt), wartet die Falle
// und sperrt das naechste, was frei wird (neues Item oder abgelaufene Sperre) fuer die volle Zeit.
function queueBlock(seconds, cause, from){
  if ((G.state.queued || []).length >= 20) return;  // Warteschlange begrenzen
  G.state.queued = [...(G.state.queued || []), {seconds, cause, from}];
  log(t("trapQueued", cause === "kira" ? t("kiraName") : "DeathLink"));
}
function applyQueuedBlocks(){
  let changed = false;
  while (G.state?.queued?.length) {
    const q = G.state.queued[0], g = blockRandom(q.seconds);
    if (!g) break;
    G.state.queued.shift(); changed = true;
    log(q.cause === "kira" ? t("kira", g) : t("deathRecv", q.from || "?", g));
  }
  return changed;
}
setInterval(() => {
  if (!G.state) return;

  const recent = u => u > Date.now() - 1500;
  if (G.state.blocks.some(b => recent(b.until)) || Object.keys(TRAP_SECONDS).some(n => recent(G.state.effects?.[n] || 0))) render();

const HINTS = ["year","studio","episodes","format","source","words","middle","season","cover"];
function makeHint(index){
  const open = G.anime.filter(a => !isDone(a));
  if (!open.length) return null;
  const r = hash(G.seed + ":sukuna:" + index);
  const a = open[r % open.length];
  const have = new Set(G.state.hints.filter(h => h.id === a.id).map(h => h.kind));
  const kinds = HINTS.filter(k => !have.has(k) && hintValue(a, k) != null);
  if (!kinds.length) return null;

}
function hintValue(a, kind){
  const name = displayTitle(a), m = LIVE.get(a.id);  // m = Live-Daten von AniList (falls schon geladen)
  switch (kind) {
    case "year": return m?.startDate?.year ?? null; case "studio": return m?.studios?.nodes?.[0]?.name ?? null;
    case "episodes": return episodesOf(a); case "format": return m?.format ? fmtName(m.format) : null;
    case "source": return m?.source ? pretty(m.source) : null; case "season": return m?.season ? pretty(m.season) : null;
    case "words": return name.split(/\s+/).length;
    case "middle": { const l = [...name.replace(/\s/g,"")]; return l[Math.floor(l.length/2)].toUpperCase(); }
    case "cover": return m?.coverImage?.large ? true : null;
  }
}
function hintText(h){

// Option "Eingesammelte zaehlen fuers Ziel": an = sie zaehlen (schnell durch), aus = nur selbst Erratenes zaehlt,
// eingesammelte Anime bleiben dann ratbar.
const collectOn = () => !G.state || G.state.collectCounts !== false;
const isOwn = a => !!G.ownSet && G.ownSet.has(a.id);

function displayTitle(a){

  if (l === "japanese") return a.titles.native || a.titles.romaji || a.title;
  return a.titles[l] || a.titles.english || a.titles.romaji || a.title;
}
// Genres eines Anime im Spiel: mit "Include Demographics" zaehlt die Zielgruppe mit.
// Die only_genres (Welt nur mit diesem Genre) zaehlen nicht zum Freischalten.
// Freischalt-Modus: "genres", "letters", "both" oder "none" (nur Zusatz-Kategorien, z. B. bei Only Genres)
const usesGenres = sd => sd.unlock_mode === "genres" || sd.unlock_mode === "both";
const usesLetters = sd => sd.unlock_mode === "letters" || sd.unlock_mode === "both";
// Bei "any": pro genre_step Genres eines Anime ein weiteres noetig (6: 1-5 -> 1, 6-11 -> 2, 12+ -> 3)
const genresNeeded = (n, step) => step ? Math.max(1, Math.min(n, 1 + Math.floor(n / step))) : 1;
const genresOf = a => {
  const sd = G.slotData, only = new Set(sd?.only_genres || []);
  return (sd?.demographics ? [...a.genres, ...(a.demographics||[])] : a.genres).filter(g => !only.has(g));
};
function canGuess(a, o){
  const sd = G.slotData, ag = genresOf(a), gs = ag.filter(g => o.genres.has(g) && !o.blocked.has(g));
  const genreOk = !ag.length || (sd.genre_rule === "all" ? gs.length === ag.length : gs.length >= genresNeeded(ag.length, sd.genre_step));
  const letterOk = o.letters.has(sd.letters[a.id]) && !o.blockedLetters.has(sd.letters[a.id]);
  const extraOk = activeExtras().every(e => { const vs = extraVals(a, e.key); return !vs.length || vs.some(v => o.extra[e.key].has(v) && !o.blockedExtra[e.key].has(v)); });
  return extraOk && (!usesGenres(sd) || genreOk) && (!usesLetters(sd) || letterOk);
}
function needs(a, o){
  const sd = G.slotData, parts = [];
  if (usesGenres(sd)) {
    const ag = genresOf(a), miss = ag.filter(g => !o.genres.has(g) || o.blocked.has(g));
    const need = genresNeeded(ag.length, sd.genre_step), have = ag.length - miss.length;
    const ok = !ag.length || (sd.genre_rule === "all" ? miss.length === 0 : have >= need);
    if (!ok) parts.push(sd.genre_rule === "all" || need - have === miss.length ? miss.join(t("and"))
      : need > 1 ? t("nOf", need - have, miss.join(", ")) : miss.join(t("or")));
  }
  if (usesLetters(sd) && (!o.letters.has(sd.letters[a.id]) || o.blockedLetters.has(sd.letters[a.id]))) parts.push(t("letterN", sd.letters[a.id]));
  for (const e of activeExtras()) { const vs = extraVals(a, e.key);
    if (vs.length && !vs.some(v => o.extra[e.key].has(v) && !o.blockedExtra[e.key].has(v))) parts.push(`${t("cat_" + e.key)} ${vs.join(t("or"))}`); }
  return parts.join(" + ");
}

$("send").onclick = guess;

// Tippfehler verzeihen: alle Schreibweisen mit genau einem Fehler (Buchstabe zu viel/zu wenig/falsch/vertauscht)
// pruefen. Die Namen stehen nur als Pruefsumme in der Datei, deshalb werden die Varianten der Eingabe geprueft.
function typoKeys(text){
  const q = norm(text), out = new Set();
  if (q.length < 5 || q.length > 60) return out;
  const AB = "abcdefghijklmnopqrstuvwxyz0123456789", add = v => out.add(cyrb53(SALT + v).toString(36));
  for (let i = 0; i <= q.length; i++) {
    if (i < q.length) add(q.slice(0, i) + q.slice(i + 1));
    if (i < q.length - 1) add(q.slice(0, i) + q[i + 1] + q[i] + q.slice(i + 2));
    for (const c of AB) { add(q.slice(0, i) + c + q.slice(i)); if (i < q.length) add(q.slice(0, i) + c + q.slice(i + 1)); }
  }
  return out;
}
// Anime finden, deren Namen zur Eingabe passen: erst genau, sonst mit einem Tippfehler (nur wenn eindeutig)
function findAnime(text, list, prefer){
  const q = nameHash(text); if (!q) return {hits: [], fuzzy: false, known: false};
  let hits = list.filter(a => a.keys.has(q));
  if (hits.length) return {hits, fuzzy: false, known: true};
  const v = typoKeys(text);
  hits = list.filter(a => [...a.keys].some(k => v.has(k)));
  if (hits.length === 1) return {hits, fuzzy: true, known: true};
  // Mehrdeutiger Tippfehler: wenn genau einer davon passt (z. B. zum Bingo-Feld), zaehlt der
  if (prefer && hits.filter(prefer).length === 1) return {hits: hits.filter(prefer), fuzzy: true, known: true};
  return {hits: [], fuzzy: false, known: ALL_KEYS.has(q) || DB.anime.some(a => [...a.keys].some(k => v.has(k)))};
}
// Welche Anime trifft dieser Text, und welche davon sind gerade ratbar? (ohne Nebenwirkungen; auch fuer den Twitch-Chat)
function freshHits(text){
  const {hits, fuzzy, known} = findAnime(text, G.anime);
  const o = owned(), fresh = hits.filter(a => (!isDone(a) || stillGuessable(a)) && canGuess(a, o));
  return {hits, fuzzy, known, o, fresh};
}
function guess(){
  if (!norm($("guess").value)) return;
  const {hits, fuzzy, known, o, fresh} = freshHits($("guess").value);
  if (!hits.length) { say(known ? t("notIn") : t("unknown"), "bad"); sfx("bad"); return; }
  // Tsundere: jede richtige Antwort wird waehrend der Falle einmal abgelehnt
  if (fresh.length && effectLeft("Tsundere") > 0 && fresh.some(a => !G.state.tsunSeen.includes(a.id))) {
    G.state.tsunSeen.push(...fresh.map(a => a.id)); saveState();
    say(t("tsundereNo"), "warn"); sfx("bad"); return;
  }
  if (fresh.length) {
    say(t("correct", fresh.map(a => `#${G.number.get(a.id)} ${displayTitle(a)}`).join(", ")) + (fuzzy ? " " + t("typoOk") : ""), "good"); sfx("ok");
    PROF.ev("guess", {list: fresh, fuzzy});
    checkAnime(fresh);
    $("guess").value = "";
  } else if (hits.every(a => isDone(a) && !stillGuessable(a))) { say(t("already", hits.map(displayTitle).join(", ")), "warn"); sfx("bad"); }
  else { const a = hits.find(a => !isDone(a) || stillGuessable(a)); say(t("locked", "#"+G.number.get(a.id), needs(a, o)), "bad"); sfx("bad"); }
}
function checkAnime(list){
  const locs = list.map(locId).filter(l => !G.checked.has(l));
  locs.forEach(l => G.checked.add(l));
  if (G.state) { for (const a of list) if (!G.ownSet.has(a.id)) { G.ownSet.add(a.id); G.state.own.push(a.id); } saveState(); }
  const done = G.anime.filter(counts).length;
  for (const n of G.slotData.milestones) if (done >= n) locs.push(MILESTONE + n);
  if (locs.length) send({cmd:"LocationChecks", locations:locs});
  render(); checkGoal();
}

// ---------- Live-Infos von AniList ----------
// Cover, Jahr, Studio, Folgen, Teile ... werden nicht mitgeliefert, sondern hier geholt:
// hoechstens 50 Anime pro Anfrage, Pause zwischen Anfragen, bei Sperre (429) warten.
// Alles wird im Browser gespeichert, damit beim naechsten Mal keine Anfrage noetig ist.
const LIVE = (() => {
  const URL = "https://graphql.anilist.co", KEY = "animepelago_live_v1", GAP = 2500, DAY = 864e5;
  const QUERY = `query($ids:[Int]){Page(perPage:50){media(id_in:$ids,type:ANIME){id title{romaji english native} synonyms
    format status episodes season source startDate{year} nextAiringEpisode{episode} coverImage{large color}
    studios(isMain:true){nodes{name}}}}}`;
  let cache = Object.create(null);
  // Sicherheit: nur gueltige Eintraege aus dem Browser-Speicher uebernehmen
  try { const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (raw && typeof raw === "object") for (const [k, e] of Object.entries(raw))
      if (/^\d+$/.test(k) && e && typeof e.t === "number" && e.d && typeof e.d === "object") cache[k] = e;
  } catch(e) {}
  const queue = [], waiting = new Map(); let busy = false, last = 0, saveTimer = null, failures = 0;
  const fresh = e => e && Date.now() - e.t < (e.d.status === "RELEASING" ? 3 : 60) * DAY;
  const get = id => cache[id]?.d || null;
  function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(cache)); } catch(e) {} }, 1000); }
  function need(ids, urgent, done){
    const todo = ids.filter(id => !fresh(cache[id]) && !queue.includes(id));
    if (urgent) queue.unshift(...todo); else queue.push(...todo);
    if (done) { if (!ids.some(id => !fresh(cache[id]))) done(); else ids.forEach(id => waiting.set(id, done)); }
    pump();
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function pump(){
    if (busy) return; busy = true;
    while (queue.length) {
      await sleep(Math.max(0, last + GAP - Date.now()));
      const batch = queue.slice(0, 50); last = Date.now();
      try {
        const r = await fetch(URL, {method:"POST", headers:{"Content-Type":"application/json", Accept:"application/json"},
                                     body:JSON.stringify({query:QUERY, variables:{ids:batch}})});
        if (r.status === 429) { await sleep(((+r.headers.get("Retry-After")) || 60) * 1000 + 2000); continue; }
        if (!r.ok) throw new Error("HTTP " + r.status);
        const media = (await r.json()).data?.Page?.media || [];
        const now = Date.now();
        for (const m of media) cache[m.id] = {t:now, d:m};
        // IDs, die AniList nicht (mehr) kennt, nicht endlos neu fragen
        for (const id of batch) if (!cache[id]) cache[id] = {t:now, d:{id, missing:true}};
        queue.splice(0, batch.length); failures = 0; save();
        const cbs = new Set(batch.map(id => waiting.get(id)).filter(Boolean)); batch.forEach(id => waiting.delete(id));
        cbs.forEach(cb => cb());
        render();
      } catch (e) {
        // AniList nicht erreichbar: spaeter nochmal, nach 3 Fehlern aufgeben (das Spiel laeuft trotzdem)
        if (++failures >= 3) { queue.length = 0; break; }
        await sleep(30000 * failures);
      }
    }
    busy = false;
  }
  return {get, need, pending: () => queue.length};
})();

  // ---------- Routen und Level ----------

  // "Chronologisch" = die Route mit der kleinsten Nummer, die noch nicht voll ist.
  const ROUTES = [

    {id: "shinigami", icon: "⚔️", ranks: ["Academy Student", "Unseated Officer", "Seated Officer", "Third Seat", "Lieutenant", "Shikai", "Bankai", "Captain", "Captain-Commander", "Soul King"]},
    {id: "hero", icon: "🦸", ranks: ["Quirkless", "U.A. Applicant", "Hero Course Student", "Provisional License", "Sidekick", "Pro Hero", "Top 10 Hero", "No. 2 Hero", "No. 1 Hero", "Symbol of Peace"]},
    {id: "jujutsu", icon: "🤞", ranks: ["Window", "First-Year Student", "Grade 4", "Grade 3", "Grade 2", "Semi-Grade 1", "Grade 1", "Special Grade", "Domain Master", "The Honored One"]},

  ];
  const ROUTE_BY = Object.fromEntries(ROUTES.map(r => [r.id, r]));
  const MAXL = 100, RANK_AT = [1, 12, 23, 34, 45, 56, 67, 78, 89, 100];
  // Level L braucht in einer Route insgesamt 10*(L-1)*L EP (wird nach hinten immer laenger); Level 100 = 99.000 EP
  const xpFor = L => 10 * (L - 1) * L, CAP = xpFor(MAXL);

  // ---------- Bingo-Bestenliste nach Namen (alle Spieler, auch ohne Profil) ----------
  function bgNames(){

      out[k] = {n, g: num(v.g, 0, 1e9), w: num(v.w, 0, 1e9), f: num(v.f, 0, 1e9)};
    }
    return out;
  }
  // r = {sides:[{name, members:[{name, fields}], fields}], winner (-1 = keiner), size (9/16/25/42), team}
  function bingo(r){
    const board = bgNames();
    r.sides.forEach((s, i) => s.members.forEach(m => {
      const k = norm(m.name); if (!k) return;
      const e = board[k] || (board[k] = {n: cleanName(m.name), g: 0, w: 0, f: 0});
      e.g++; e.f += m.fields; if (r.winner === i) e.w++;
    }));
    const keys = Object.keys(board); if (keys.length > 300) keys.sort((a, b) => board[a].g - board[b].g).slice(0, keys.length - 300).forEach(k => delete board[k]);
    write(BG_NAMES, board);
    // Zaehlt fuers Profil, wenn sein Name mitgespielt hat
    const p = cur(); if (!p) return;
    const me = norm(p.name);
    r.sides.forEach((s, i) => { const m = s.members.find(m => norm(m.name) === me); if (!m) return;
      ev("bg", {fields: m.fields, won: r.winner === i, draw: r.winner < 0 && r.full, size: r.size, team: !!s.team,
                oppFields: Math.max(0, ...r.sides.filter((_, j) => j !== i).map(o => o.fields))}); });
  }

// Die Buchstaben jedes Wortes im Titel werden gemischt (Wortreihenfolge bleibt). Endlos mit Serie oder 2 Minuten auf Zeit.
// Hinweis: deckt den naechsten Anfangsbuchstaben auf (auf Zeit kostet das 5 Sekunden).
const WS = (() => {
  const KEY = PROF.pkey("animepelago_wordsalad_v1"), ROUND = 120000;

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(sv)); } catch(e) {} };
  const titleOf = (a, lang) => { const T = a.titles, en = T.english || T.romaji || a.title; return lang === "japanese" ? (T.romaji || en) : (T[lang] || en); };
  // Woerter nur aus Buchstaben/Ziffern (Grossbuchstaben, ohne Akzente), Satzzeichen fallen weg
  const wordsOf = s => s.normalize("NFKD").replace(/\p{M}/gu, "").toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  const shuffle = w => { if (w.length < 2 || new Set(w).size < 2) return w;
    for (let i = 0; i < 20; i++) { const c = [...w]; for (let j = c.length - 1; j > 0; j--) { const k = Math.floor(Math.random() * (j + 1)); [c[j], c[k]] = [c[k], c[j]]; }
      if (c.join("") !== w) return c.join(""); } return w; };
  // Passende Titel: lateinische Schrift, 1-5 Woerter, 4-28 Buchstaben, mindestens ein Wort mischbar
  function pick(){
    const only = $("mOnly").value; let pool = DB.anime.slice(0, Math.max(50, +$("mPool").value || 500));
    if (only) pool = pool.filter(a => a.genres.includes(only) || a.demographics.includes(only));
    const ok = a => { const s = titleOf(a, st.lang); if (/[^\p{Script=Latin}\p{N}\p{P}\p{S}\s]/u.test(s)) return false;
      const w = wordsOf(s), n = w.join("").length; return w.length >= 1 && w.length <= 5 && n >= 4 && n <= 28 && w.some(x => x.length > 2); };
    const cand = pool.filter(a => ok(a) && !st.seen.has(a.id));
    const list = cand.length ? cand : DB.anime.filter(ok);
    return list[Math.floor(Math.random() * list.length)];
  }
  function start(timed){
    clearInterval(tick);

    ["offline", "modes", "connect", "more"].forEach(id => $(id).classList.add("hide"));
    $("wordsalad").classList.remove("hide");
    $("wsHead").textContent = t(timed ? "wsTitleTimed" : "wsTitle");
    $("wsGuess").placeholder = t("wsPh");
    if (timed) tick = setInterval(clock, 250);
    round();
  }
  function round(){
    const a = pick(); st.seen.add(a.id);
    const title = titleOf(a, st.lang), words = wordsOf(title);

    $("wsMsg").textContent = ""; $("wsMsg").className = ""; $("wsGuess").value = ""; hideKeyArt($("wsReveal"));
    $("wsNext").textContent = t("hmNext"); $("wsNext").classList.add("hide"); ["wsSend", "wsHint", "wsSkip"].forEach(id => $(id).classList.remove("hide"));
    $("wsGuess").disabled = false; draw(); clock(); $("wsGuess").focus();
  }
  // Hinweise: Anfangsbuchstaben der Woerter der Reihe nach fest an Platz 1
  function tiles(){
    const n = Math.max(8, ...st.words.map(w => w.length));  // alle Kacheln gleich gross, passend zum laengsten Wort
    return st.words.map((w, i) => { const s = st.solved ? w : st.mixed[i], fix = i < st.hints && !st.solved;
      return `<div class="w" style="--n:${n}">${[...s].map((c, j) => `<span class="${fix && j === 0 ? "fix" : ""}">${esc(c)}</span>`).join("")}</div>`; }).join("");
  }

  }
  function timeUp(){
    st.over = true; clearInterval(tick);

    st.solved = true; draw(); keyArt($("wsReveal"), st.a, st.title);
    $("wsMsg").textContent = t("wsTimeUp", st.score, best ? t("wsNewBest") : "") + " · " + t("wsSkipped", st.title); $("wsMsg").className = "good";
    ["wsSend", "wsHint", "wsSkip"].forEach(id => $(id).classList.add("hide")); $("wsGuess").disabled = true;
    $("wsNext").textContent = t("wsAgain"); $("wsNext").classList.remove("hide"); $("wsNext").focus(); sfx("win");
  }
  function guess(){
    if (!st || st.solved || st.over) return;
    const text = $("wsGuess").value; if (!norm(text)) return;
    // Richtig: genau der Titel (ohne Satzzeichen) oder ein anderer Name genau dieses Anime
    const ok = norm(text) === norm(st.title) || findAnime(text, DB.anime, a => a.id === st.a.id).hits.some(a => a.id === st.a.id);
    if (!ok) { $("wsMsg").textContent = t("wsWrong"); $("wsMsg").className = "bad"; sfx("bad"); $("wsGuess").select(); return; }
    st.solved = true; sfx("ok");

    $("wsMsg").textContent = t("wsRight", st.title); $("wsMsg").className = "good";

  }
  function hint(){

  $("wsBack").onclick = () => { clearInterval(tick); st = null; $("wordsalad").classList.add("hide"); setMode("more"); };
  return {start, wordsOf, shuffle};
})();

const TOP = (() => {

  $("tpGive").onclick = giveUp; $("tpNew").onclick = restart; $("tpBack").onclick = leave;

})();

// Raster mit Themen an Zeilen und Spalten; jedes Feld braucht einen Anime, der beide erfuellt.
// Jedes Feld hat mindestens so viele passende Anime wie das Raster Felder -> man kann sich nie verspielen.
const BG = (() => {
  const KEY = PROF.pkey("animepelago_bingo_v1");
  let st = null, best = {score: 0, full: 0};
  try { best = Object.assign(best, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e) {}

    for (const x of ["Manga", "Light Novel", "Novel", "Original", "Visual Novel", "Video Game"]) add("src:" + x, em(x) + x, a => a.c?.[1] === x);
    for (const x of ["<2000", "2000s", "2010s", "2020s"]) add("dec:" + x, "📅 " + x, a => decade(a.c?.[0]) === x);
    // Einzelne Jahre (in den Daten ab 2010 einzeln, davor nur Zeitraeume)
    const years = [...new Set(pool.map(a => a.c?.[0]).filter(y => /^\d{4}$/.test(y || "")))].sort();
    for (const y of years) add("y:" + y, "🗓️ " + y, a => a.c?.[0] === y);

    const AZ = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"], rare = AZ.filter(L => (lc[L] || 0) < RARE), common = AZ.filter(L => (lc[L] || 0) >= RARE);

    for (const minPair of [R * C, 2]) {
