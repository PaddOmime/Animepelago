<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Sicherheit: nur eigene Skripte; Bilder nur von TMDB; Verbindungen nur zur eigenen Seite und zur Firebase-Datenbank -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org https://s4.anilist.co https://*.anilist.co https://*.fandom.com https://static.wikia.nocookie.net; connect-src 'self' https://*.firebaseio.com https://*.firebasedatabase.app https://graphql.anilist.co; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Animepelago Party</title>
<style>
:root{--bg:#F4F2FA;--fg:#1E1B33;--mute:#5E5978;--card:#FFFFFF;--line:#E2DEF0;--ok:#1f8a4c;--bad:#b3261e;--warn:#c2570c;--accent:var(--fav,#FF9EC4);--grey:#ECE9F5;
  --on-accent:var(--fav-on,#191B30);--accent-ink:color-mix(in srgb,var(--accent) 42%,#1E1B33);
  --c0:#2f6fd6;--c1:#d9480f;--c2:#8e44ad;--c3:#1f8a4c;--c4:#c2185b;--c5:#00838f;--c6:#9a6a00;--c7:#555}
@media (prefers-color-scheme:dark){:root{--bg:#191B30;--fg:#F1EEFA;--mute:#B9B4D6;--card:#2A2D4A;--line:#3A3E63;--ok:#4cc27e;--bad:#ff6b60;--warn:#ff9a4d;--accent:var(--fav,#FF9EC4);--grey:#33365A;--accent-ink:var(--accent);
  --c0:#6fa3ff;--c1:#ff8a4d;--c2:#c08bff;--c3:#4cc27e;--c4:#ff6fa8;--c5:#4dd0e1;--c6:#f0c040;--c7:#bbb}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0 0 12px}
.hide{display:none!important}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:8px}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input,label select{width:100%}
label>span:first-child{display:block;margin-bottom:2px}
button{cursor:pointer}
button.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 160px}
.mute{color:var(--mute)}.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
#topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
a{color:var(--accent-ink)}
/* Spielerleiste: fuer jeden Spieler eine Karte in seiner Farbe */
#bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.pl{border:3px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
.pl .nm{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.pl .st{font-size:13px;color:var(--mute)}
.pl .pts{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.pl.now{box-shadow:0 0 0 3px var(--accent) inset}
.code{font:800 34px/1 ui-monospace,monospace;letter-spacing:4px}
/* Show-Ansicht: gross fuer den Stream */
.big .anime{font-size:30px;font-weight:800;text-align:center;margin:10px 0}
.anime img{display:block;max-height:110px;max-width:70%;margin:6px auto;object-fit:contain}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.col{border:2px solid var(--line);border-radius:10px;padding:6px}
.col ol{margin:0;padding-left:26px}
.col li{padding:2px 0;overflow-wrap:anywhere;font-size:14px}
.col li.new{font-weight:800}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.slots button{padding:12px 6px;font-size:15px;text-align:left;overflow:hidden}
.slots button b{display:block;font-size:20px}
.bzw{width:min(300px,70vw);aspect-ratio:3/4;margin:0 auto;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#000}
.bzw img{width:100%;height:100%;object-fit:cover;transition:filter .6s ease,transform .6s ease}
.bzbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;max-width:420px;margin:10px auto}.bzbar>i{display:block;height:100%;background:var(--fav,#ff5fa2);transition:width .25s linear}
.pkc{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pkc img{width:min(260px,60vw);aspect-ratio:5/7;object-fit:cover;border-radius:16px;background:var(--line)}
.pkc .nm{font-size:22px;font-weight:800}.pkc .an{color:var(--mute)}
.pkbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;max-width:420px;margin:6px auto}.pkbar>i{display:block;height:100%;background:#3ba55c}
.pk18tag{display:inline-block;background:#e5484d;color:#fff;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:800;margin-left:6px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}
.vs .card{border:2px solid var(--line);border-radius:12px;padding:12px;min-height:120px}
.vs .val{font-size:26px;font-weight:800}
.hol button{font-size:24px;padding:14px 22px}
.pick{font-size:28px}
/* Party-Bingo: Raster mit Kategorien oben und links */
/* Higher or Lower am Handy: beide Anime mit Logo nebeneinander */
.hvs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;margin-bottom:10px}
.hlogo{display:block;max-width:100%;max-height:70px;object-fit:contain;margin:0 auto 4px}
.bgw{overflow-x:auto}
/* Alle Felder gleich gross: feste Spaltenbreiten (colgroup) und feste Hoehe fuer den Inhalt (.cc) */
.bgt{--rh:110px;--cw:150px;--ch:76px;border-collapse:separate;border-spacing:4px;margin:0 auto;table-layout:fixed;width:calc(var(--rh) + var(--n) * (var(--cw) + 4px) + 4px)}
.bgt col.rh{width:var(--rh)}
.bgt th{font-size:13px;font-weight:700;padding:4px;overflow-wrap:break-word;vertical-align:middle}
.bgt td{border:2px solid var(--line);border-radius:8px;padding:3px;text-align:center;vertical-align:middle;font-size:14px}
.bgt .cc{height:var(--ch);display:flex;align-items:center;justify-content:center;overflow:hidden;overflow-wrap:anywhere;line-height:1.2}
.bgt .blogo{display:block;max-width:100%;max-height:100%;object-fit:contain}
.bgt td.free{cursor:pointer}
.bgt td.sel{box-shadow:0 0 0 3px var(--accent) inset}
.bgt td.won{outline:3px dashed var(--fg);outline-offset:2px;font-weight:800}
#pad .bgt{--rh:70px;--ch:52px;width:100%;min-width:calc(var(--rh) + var(--n) * 50px);max-width:calc(var(--rh) + var(--n) * 130px)}
#pad .bgt th,#pad .bgt td{font-size:11px;padding:2px}
@media (max-width:500px){#pad .bgt{--rh:56px;--ch:46px;border-spacing:3px}#pad .bgt th,#pad .bgt td{font-size:10px}}
.bgin{display:flex;gap:8px;margin:10px 0}
.bgin input{flex:1 1 auto;min-width:0}
.bgin button{flex:0 0 auto;white-space:nowrap}
.bglog{font-size:14px;margin:8px 0 0;padding-left:18px}
.clock{font:800 28px/1 ui-monospace,monospace}

/* ===== 2.0: Stil wie das neue Hauptmenue ===== */
#topbar h1 a{color:inherit}
#viewHead{display:flex;align-items:center;gap:10px;margin:4px 0 12px}#viewHead h2{margin:0;font-size:20px}
.vhb{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--fg)}
.htiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ht{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:12px;min-height:150px;padding:20px;border-radius:22px;background:var(--card);border:0;text-align:left;color:var(--fg);font-weight:400}
.ht b{display:block;font-size:20px;font-weight:800}.ht .tx>span{display:block;font-size:14px;color:var(--mute);margin-top:4px;line-height:1.4}
.ht.big{background:var(--accent);color:var(--on-accent);cursor:pointer}.ht.big .tx>span{color:inherit;opacity:.85}
.ht.big:hover{filter:brightness(1.05)}
.joinc label{color:var(--mute)}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.gt{min-height:72px;border-radius:18px;background:var(--grey);border:3px solid transparent;text-align:left;padding:12px 14px}
.gt b{font-size:16px;font-weight:800}.gt:hover{border-color:var(--accent)}.gt.on{border-color:var(--accent);background:var(--card)}
body:has(#show:not(.hide)) #viewHead,body:has(#ctrl:not(.hide)) #viewHead{display:none}
#lobby .row>label{flex:0 1 240px}#lobby .row>label.pkOpt{flex:0 1 auto}
#topbar{align-items:center}
.opts{margin-top:8px}.opts summary{cursor:pointer;font-weight:800;color:var(--mute)}
body{font:15px/1.45 "M PLUS Rounded 1c","Nunito",ui-rounded,"Hiragino Maru Gothic ProN","Segoe UI",system-ui,sans-serif}
main{padding:16px 20px 40px}
h1{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800}
h2,h3,h4{font-weight:800}
.box{border-radius:20px;padding:16px;border-color:transparent}
input,select,button{border-radius:12px;min-height:42px}
button{font-weight:700}button.main{font-weight:800}
.pl{border-radius:16px;background:var(--card)}
.col,.vs .card{border-radius:16px}
.code{color:var(--accent-ink)}
.slots button,.hol button{border-radius:14px}
#bar .pl{border-width:3px}
</style>
</head>
<body>
<main>
<div id="topbar">
  <h1><a href="index.html" style="color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.4 5.6 6 .5-4.6 4 1.4 5.9L12 16l-5.2 3 1.4-5.9-4.6-4 6-.5z"></path></svg>Animepelago</a></h1>
  <span><select id="uilang" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="it">Italiano</option><option value="ja">日本語</option></select></span>
</div>
<div id="viewHead"><a href="index.html" id="vhBack" class="vhb" data-t-aria="plBack"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a><h2 data-t="tileParty"></h2></div>

<!-- Start: Raum erstellen (Show-Ansicht) oder beitreten (Controller) -->
<section id="start">
  <p class="mute" data-t="intro" style="margin:0 0 14px"></p>
  <div class="htiles">
    <button type="button" id="host" class="ht big"><span class="tx"><b data-t="host"></b><span data-t="hostInfo"></span></span></button>
    <div class="ht joinc"><span class="tx"><b data-t="plJoinT"></b><span data-t="plJoinD"></span></span>
      <div class="row" style="width:100%">
        <label><span data-t="yourName"></span><input id="name" maxlength="20" autocomplete="off"></label>
        <label style="flex:0 1 140px"><span data-t="roomCode"></span><input id="code" maxlength="5" autocomplete="off" style="text-transform:uppercase"></label>
        <button type="button" id="join" class="main" style="flex:0 0 auto" data-t="join"></button>
      </div>
    </div>
  </div>
  <div class="row hide" id="reopenRow" style="margin-top:6px"><button type="button" id="reopen" style="flex:0 0 auto"></button></div>
  <p id="netInfo" class="mute" style="font-size:12px;margin:8px 0 0"></p>
  <div id="startMsg"></div>
</section>

<!-- Show-Ansicht (im Discord teilen) -->
<section id="show" class="hide">
  <div class="box">
    <div class="row" style="align-items:center">
      <div style="flex:0 0 auto"><div class="mute" data-t="roomCode"></div><div class="code" id="showCode"></div></div>
      <div id="showHead" style="flex:1 1 300px"></div>
      <a id="playToo" target="_blank" rel="noopener" style="flex:0 0 auto" data-t="playToo"></a>
      <button type="button" id="leaveShow" style="flex:0 0 auto" data-t="leave"></button>
    </div>
    <div id="bar"></div>
  </div>
  <div class="box" id="lobby">
    <h3 data-t="plGames" style="margin:0 0 10px"></h3>
    <div class="gtiles" id="gTiles">
      <button type="button" class="gt" data-g="blind"><b data-t="g_blind"></b></button>
      <button type="button" class="gt" data-g="hol"><b data-t="g_hol"></b></button>
      <button type="button" class="gt" data-g="pick"><b data-t="g_pick"></b></button>
      <button type="button" class="gt" data-g="buzz"><b data-t="g_buzz"></b></button>
      <button type="button" class="gt" data-g="bingo"><b data-t="g_bingo"></b></button>
    </div>
    <p class="mute" id="gameInfo" style="font-size:14px;margin:10px 0"></p>
    <div class="row">
      <label class="hide"><span data-t="game"></span><select id="gameSel"><option value="blind" data-t="g_blind"></option><option value="hol" data-t="g_hol"></option><option value="pick" data-t="g_pick"></option><option value="buzz" data-t="g_buzz"></option><option value="bingo" data-t="g_bingo"></option></select></label>
      <label class="bgOpt"><span data-t="bgMode"></span><select id="bgMode"><option value="vs" data-t="bgVs"></option><option value="coop" data-t="bgCoop"></option></select></label>
      <label class="bgOpt"><span data-t="bgSize"></span><select id="bgSize"><option value="3">3×3</option><option value="4">4×4</option><option value="5" selected>5×5</option><option value="6">6×6</option></select></label>
      <label class="pkOpt"><span data-t="pkG"></span><select id="pkG"><option value="" data-t="pkAll"></option><option value="f" data-t="pkF"></option><option value="m" data-t="pkM"></option><option value="nb" data-t="pkNB"></option></select></label>
      <label class="pkOpt pk18Opt" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="pk18" style="width:auto;min-height:0"><span data-t="pk18"></span></label>
      <label class="notBg"><span data-t="rounds"></span><select id="rounds"><option>5</option><option selected>10</option><option>15</option></select></label>
    </div>
    <details class="opts"><summary data-t="plOpts"></summary>
      <div class="row" style="margin-top:8px">
        <label><span data-t="pool"></span><input id="pool" type="number" min="20" value="300"></label>
        <label><span data-t="lang"></span><select id="tlang"><option value="english">English</option><option value="romaji">Romaji</option><option value="german">Deutsch</option></select></label>
      </div>
    </details>
    <button type="button" id="startGame" class="main" style="margin-top:12px;min-width:200px;min-height:48px;font-size:17px" data-t="startGame"></button>
    <span id="lobbyMsg" class="warn"></span>
  </div>
  <div class="box big hide" id="stage"></div>
</section>

<!-- Controller (jeder Spieler, am Handy oder im zweiten Fenster) -->
<section id="ctrl" class="hide">
  <div class="box">
    <div class="row" style="align-items:center">
      <div style="flex:1 1 auto"><b id="meName"></b> <span class="mute" id="meRoom"></span></div>
      <button type="button" id="leaveCtrl" style="flex:0 0 auto" data-t="leave"></button>
    </div>
  </div>
  <div class="box" id="pad"></div>
</section>
<p class="mute" style="font-size:12px" data-t="privacy"></p>
</main>
<script src="game_data.js"></script>
<script>
// Lieblingsfarbe aus dem Profil (vom Hauptmenue gemerkt) - Schrift darauf hell oder dunkel je nach Helligkeit
try { const c = localStorage.getItem("ap_fav_now"); if (/^#[0-9a-f]{6}$/i.test(c || "")) { const r = document.documentElement.style;
  const lin = v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4), [R, G, B] = [1, 3, 5].map(i => lin(parseInt(c.slice(i, i + 2), 16) / 255));
  r.setProperty("--fav", c); r.setProperty("--fav-on", 0.2126 * R + 0.7152 * G + 0.0722 * B > 0.18 ? "#191B30" : "#FFFFFF"); } } catch(e) {}
</script>

        if (!takenBy.has(id) || grab(takenBy.get(id), seen)) { takenBy.set(id, k); return true; }
      }
      return false;

    let taken = 0;
    for (let k = 0; k < others.length && taken < mine.size; k++) if (grab(k, new Set())) taken++;

// Jahr und Jahrzehnt duerfen sich nicht kreuzen (sonst "2010s x 2013"): beide nur bei den Zeilen oder beide nur bei den Spalten
// Ebenso Buchstabe und Buchstaben-Paar (sonst "J / K x K"). Familien: Zeit (Jahr, Jahrzehnt) und Buchstaben (einzeln, Paar)
const famOf = k => { const ty = (typeof k === "string" ? k : k?.key || "").split(":")[0]; return ty === "y" || ty === "dec" ? "time" : ty === "l" || ty === "l2" ? "let" : null; };

const timeClash = (rows, cols) => { const f = new Set(rows.map(famOf).filter(Boolean)); return cols.some(c => f.has(famOf(c))); };
// Je seltenem Buchstaben nur ein zufaelliges Paar behalten, und etwa so viele Paare wie Einzelbuchstaben:
// so ist es zufaellig, ob ein Buchstabe oder zwei kommen
function pickPairs(list){
  const seen = new Set(), keep = new Set();
  const pairs = list.filter(x => x.key.startsWith("l2:")).sort(() => Math.random() - .5), singles = list.filter(x => x.key.startsWith("l:")).length;
  for (const th of pairs) if (!seen.has(th.rareL)) { seen.add(th.rareL); keep.add(th); }   // erst jeder seltene Buchstabe einmal
  for (const th of pairs) if (keep.size < singles) keep.add(th);                         // dann auffuellen: etwa gleich viele Paare wie Einzelbuchstaben
  return list.filter(th => !th.key.startsWith("l2:") || keep.has(th));
}
// R Zeilen und C Spalten (z. B. 3x3 oder 6x7)
function generate(R, C, pool, lang, types){
  const n = Math.max(R, C);
  const typeOf = th => { const ty = th.key.split(":")[0]; return ty === "l2" ? "l" : ty; };
  const count = (x, y) => pool.filter(a => x.test(a) && y.test(a)).length;
  // Bei nur einer Themen-Art duerfen alle Zeilen und Spalten von dieser Art sein
  const maxPerType = types.length >= 2 ? Math.max(3, n) : 2 * n;
  const typesOk = list => { const c = {}; for (const t of list) c[typeOf(t)] = (c[typeOf(t)] || 0) + 1; return Object.values(c).every(v => v <= maxPerType); };
  const shuffled = l => [...l].sort(() => Math.random() - .5);
  const themesAll = pickPairs(themes(pool, lang).filter(th => types.includes(typeOf(th))));
  // Zwei Durchgaenge: erst streng (jedes Feld mind. n*n Anime, wie bisher: sicher und schnell gefunden),
  // dann locker (nur so viele, wie die "nie festfahren"-Regel wirklich braucht, z. B. bei Buchstabe x Jahreszeit)
  for (const minPair of [R * C, 2]) {
    const all = themesAll.filter(th => pool.filter(th.test).length >= Math.max(n, minPair));
    // Grosse Themen (viele Anime) etwas oefter ziehen: dann passen leichter genug Spalten zu allen Zeilen
    const size = new Map(all.map(th => [th, pool.filter(th.test).length]));
    const weighted = l => l.map(x => [x, Math.random() ** (1 / Math.sqrt(size.get(x)))]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
    for (let attempt = 0; attempt < 300; attempt++) {
      // Zeilen zufaellig, dann nur Spalten, die mit ALLEN Zeilen genug Anime haben
      const rows = (R * C > 25 ? weighted(all) : shuffled(all)).slice(0, R);
      if (rows.length < R || !typesOk(rows)) continue;
      const okCols = shuffled(all.filter(c => !rows.includes(c) && !timeClash(rows, [c]) && rows.every(r => count(r, c) >= minPair)));
      const cols = [];
      for (const c of okCols) { if (cols.length === C) break; if (typesOk([...rows, ...cols, c])) cols.push(c); }
      if (cols.length < C) continue;
      const cand = rows.map(r => cols.map(c => pool.filter(a => r.test(a) && c.test(a))));
      if (!safe(cand)) continue;
      return {rows, cols, cand};
    }
  }
  return null;
}
// Eine Kategorie aus ihrem Schluessel wieder bauen ("g:Action", "l2:JK", "y:2013" ...): so reicht es, im Raum nur die Schluessel zu speichern
const BG_TYPES = ["g", "d", "s", "src", "dec", "sea", "y", "l"];
function themeOf(key, lang){
  if (typeof key !== "string" || key.length > 60) return null;
  const i = key.indexOf(":"), ty = key.slice(0, i), v = key.slice(i + 1); if (i < 1 || !v) return null;
  const T = (label, test) => ({key, label, test});
  if (ty === "g" && GENRES.slice(0, 18).includes(v)) return T(em(v) + v, a => a.genres.includes(v));
  if (ty === "d" && DEMOGRAPHICS.includes(v)) return T(em(v) + v, a => a.demographics.includes(v));
  if (ty === "s") return T("🎬 " + v, a => (a.s || []).includes(v));
  if (ty === "src" && ["Manga", "Light Novel", "Novel", "Original", "Visual Novel", "Video Game"].includes(v)) return T(em(v) + v, a => a.c?.[1] === v);
  if (ty === "dec" && ["<2000", "2000s", "2010s", "2020s"].includes(v)) return T("📅 " + v, a => decade(a.c?.[0]) === v);
  if (ty === "y" && /^\d{4}$/.test(v)) return T("🗓️ " + v, a => a.c?.[0] === v);
  if (ty === "sea" && ["Winter", "Spring", "Summer", "Fall"].includes(v)) return T(em(v) + v, a => a.c?.[2] === v);
  if (ty === "l" && /^[A-Z]$/.test(v)) return T("🔤 " + v, a => firstLetterOf(a, lang) === v);
  if (ty === "l2" && /^[A-Z]{2}$/.test(v)) return T(`🔤 ${v[0]} / ${v[1]}`, a => { const L = firstLetterOf(a, lang); return L === v[0] || L === v[1]; });
  return null;
}

const CODE_ABC = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function setPath(tree, path, value){
  const keys = path.split("/").filter(Boolean); if (!keys.length) return value;
  const root = tree && typeof tree === "object" ? tree : {}; let o = root;
  for (const k of keys.slice(0, -1)) { if (!o[k] || typeof o[k] !== "object") o[k] = {}; o = o[k]; }
  if (value == null) delete o[keys.at(-1)]; else o[keys.at(-1)] = value;
  return root;
}
// Der ganze Raum wird mit jeder Aenderung an alle Fenster geschickt (localStorage gleicht zwischen Tabs nur verzoegert ab)
class LocalNet {
  constructor(code){ this.code = code; this.key = "ap_party_room_" + code; this.ch = new BroadcastChannel("ap_party_" + code); this.cb = null; this.tree = this.read();
    this.ch.onmessage = ev => { this.tree = ev.data; this.cb && this.cb(this.tree); }; }
  read(){ try { return JSON.parse(localStorage.getItem(this.key) || "null"); } catch(e) { return null; } }
  async put(path, value){ const tree = setPath(structuredClone(this.tree ?? this.read()), path, value);
    if (path === "" && value != null) tree.created = Date.now();
    this.tree = tree; try { localStorage.setItem(this.key, JSON.stringify(tree)); } catch(e) {}
    this.ch.postMessage(tree); this.cb && this.cb(tree); return true; }
  async exists(){ const r = this.read(); return !!(r && r.created > Date.now() - 6 * 3600e3); }
  listen(cb){ this.cb = cb; cb(this.tree); }
  close(){ this.ch.close(); this.cb = null; }
}
class FirebaseNet {
  constructor(code){ this.code = code; this.base = FIREBASE_DB.replace(/\/+$/, "") + "/rooms/" + code; this.tree = null; this.es = null; this.cb = null; }
  url(path){ return this.base + (path ? "/" + path : "") + ".json"; }
  async put(path, value){
    if (path === "" && value != null) value = {...value, created: {".sv": "timestamp"}};
    for (let i = 0; i < 3; i++) {
      try { const r = await fetch(this.url(path), {method: "PUT", body: JSON.stringify(value)}); if (r.ok) return true; if (r.status < 500) return false; } catch(e) {}
      await new Promise(res => setTimeout(res, 800 * (i + 1)));
    }
    return false;
  }
  async exists(){ try { const r = await fetch(this.url("created")); return r.ok && (await r.json()) > Date.now() - 6 * 3600e3; } catch(e) { return false; } }
  listen(cb){
    this.cb = cb; this.es = new EventSource(this.url(""));
    const apply = (ev, merge) => { let m; try { m = JSON.parse(ev.data); } catch(e) { return; }
      if (!m || typeof m.path !== "string") return;
      if (merge && m.data && typeof m.data === "object") for (const [k, v] of Object.entries(m.data)) this.tree = setPath(this.tree, m.path + "/" + k, v);
      else this.tree = m.path === "/" ? m.data : setPath(this.tree, m.path, m.data);
      this.cb && this.cb(this.tree); };
    this.es.addEventListener("put", ev => apply(ev, false));
    this.es.addEventListener("patch", ev => apply(ev, true));
    this.es.addEventListener("cancel", () => APP.netError());
    this.es.onerror = () => APP.netError();
  }
  close(){ if (this.es) this.es.close(); this.es = null; this.cb = null; }
}
const Net = FIREBASE_DB ? FirebaseNet : LocalNet;

const cleanName = s => String(s ?? "").replace(/[\u0000-\u001f\u007f-\u009f]/g, "").replace(/\s+/g, " ").trim().slice(0, 20);

const CHARS = (() => {

    if (data) return Promise.resolve(data);
    return new Promise((ok, fail) => {
      const done = () => { const raw = window.ANIMEPELAGO_CHARS; if (!raw || !raw.a) return fail(); data = new Map();
        for (const [aid, rows] of Object.entries(raw.a)) if (BY_ID.has(+aid)) data.set(+aid, rows.map(r => ({aid: +aid, h: r[0], keys: Array.isArray(r[1]) ? r[1] : [], g: r[2] || "", w: +r[3] || 1, adult: !!r[4], img: r[5] === 0 ? 0 : (typeof r[5] === "string" ? r[5] : "")})));
        ok(data); };
      if (window.ANIMEPELAGO_CHARS) return done();
      const sc = document.createElement("script"); sc.src = "characters.js"; sc.onload = done; sc.onerror = () => fail(); document.head.appendChild(sc);
    });
  }
  const URL_OK = u => typeof u === "string" && u.length < 300 && !/default\.(jpg|png)$/.test(u)
    && (/^https:\/\/[a-z0-9.-]*anilist\.co\/[\w\/.\-]+$/.test(u) || /^https:\/\/[a-z0-9-]{2,60}\.fandom\.com\/wiki\/Special:FilePath\/[\w.%\-]+$/.test(u));
  const fandomUrl = c => { if (typeof c.img !== "string" || !c.img) return null; const [w, f] = c.img.split("|");
    return /^[a-z0-9-]{2,60}$/.test(w || "") && f && f.length < 200 ? `https://${w}.fandom.com/wiki/Special:FilePath/${encodeURIComponent(f.replace(/ /g, "_")).replace(/[()'!*]/g, x => "%" + x.charCodeAt(0).toString(16).toUpperCase())}` : null; };
  const loads = url => new Promise(r => { const img = new Image(), tm = setTimeout(() => r(false), 10000); img.referrerPolicy = "no-referrer";
    img.onload = () => { clearTimeout(tm); r(!!img.naturalWidth); }; img.onerror = () => { clearTimeout(tm); r(false); }; img.src = url; });
  async function picture(c){
    const k = c.aid + ":" + c.h; if (cache.has(k)) return cache.get(k);
    if (c.img === 0) return null;
    const wait = Math.max(0, last + 700 - Date.now()); if (wait) await new Promise(r => setTimeout(r, wait)); last = Date.now();
    let name; try { name = unhide(c.h, c.aid); } catch(e) { return null; }
    const q = `query($s:String){Page(perPage:6){characters(search:$s){image{large} media(perPage:50,type:ANIME){nodes{id}}}}}`;
    const res = await fetch("https://graphql.anilist.co", {method: "POST", headers: {"Content-Type": "application/json", Accept: "application/json"},

    const hit = ((await res.json())?.data?.Page?.characters || []).find(x => (x.media?.nodes || []).some(m => parts.has(m.id)));
    let url = hit && URL_OK(hit.image?.large) ? hit.image.large : null;
    if (!url) { const f = fandomUrl(c); url = f && URL_OK(f) ? f : null; }

  }
  const weighted = l => { const sum = l.reduce((s, c) => s + c.w, 0); let x = Math.random() * sum; for (const c of l) { x -= c.w; if (x <= 0) return c; } return l[l.length - 1]; };
  return {load, picture, weighted, URL_OK};
})();

    valid(g, ans, v){ const used = Object.entries(ans || {}).filter(([r]) => +r !== g.round).map(([, p]) => p); return Number.isInteger(v) && v >= 1 && v <= g.n && !used.includes(v); },
    // Am Ende: Abstand zur AniList-Beliebtheit (Summe |Platz - richtiger Platz|), kleiner = besser
    score(g, ans){ const order = [...g.items].sort((a, b) => RANK.get(a) - RANK.get(b));
      return g.items.reduce((s, id, r) => s + (ans && ans[r] ? Math.abs(ans[r] - (order.indexOf(id) + 1)) : g.n), 0); },
  },
  // Higher or Lower: Paare; Frage: beliebter oder neuer?
  hol: {

// Show-Ansicht nach Neuladen (z. B. in OBS) wieder oeffnen, solange der Raum noch lebt
(async () => { const c = store.get("ap_party_show"); if (!codeOk(c || "") || !await new Net(c).exists()) return;
  $("reopen").textContent = t("reopen", c); $("reopenRow").classList.remove("hide"); $("reopen").onclick = () => APP.open("show", c); })();
</script>
</body>
</html>
